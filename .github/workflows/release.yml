# grype scan threshold: --fail-on high --only-fixed (blocks release on actionable high/critical CVEs).
# Thresholds and false-positive exclusions are configured in .grype.yaml at repository root.
name: Publish Python distributions to PyPI

on:
  release:
    types: [created]

permissions:
  contents: read
  actions: read

jobs:
  build-n-publish:
    name: Build and publish Python distributions to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write  # PyPI Trusted Publishing (OIDC), scoped to this publish job only

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
    - name: Require release commit on main with successful CI
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        RELEASE_COMMIT=$(git rev-parse "$GITHUB_SHA^{commit}")
        git fetch origin main
        git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
        SUCCESSFUL_RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$RELEASE_COMMIT" --status completed --json conclusion --jq 'map(select(.conclusion == "success")) | length')
        test "$SUCCESSFUL_RUNS" -ge 1
    - name: Setup python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: 3.12
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      with:
        version: "0.11.25"
    - name: Install locked privacy/release checks
      run: uv sync --extra dev --locked
    - name: Enforce privacy release gates
      run: |
        uv run --no-sync python scripts/check_sensitive_content.py --require-approved-assets
        uv run --no-sync python scripts/check_ignored_asset_files.py --strict
        uv run --no-sync python scripts/run_semgrep_privacy.py
    - name: Build a binary wheel and a source tarball
      # Build with the pinned uv toolchain already installed above (uv resolves
      # build deps from the project) instead of an unpinned `pip install build`.
      # Removes the SonarCloud S8544 (unpinned deps) finding on the release path and
      # drops the unused setuptools/wheel/twine installs (gh-action-pypi-publish
      # uploads on its own).
      run: uv build
    - name: Scan built artifacts with grype
      uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
      id: grype-scan
      with:
        path: dist/
        fail-build: true
        severity-cutoff: high
        output-format: json
        output-file: grype-scan.json
        only-fixed: true
    - name: Upload grype scan results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      if: always()
      with:
        name: grype-release-scan
        path: grype-scan.json
        retention-days: 30
    - name: Publish distribution to PyPI (Trusted Publishing / OIDC)
      # No password/secret: authenticates via a short-lived OIDC token (needs the
      # job-level `id-token: write` permission above). Before the FIRST real publish,
      # register a PyPI "trusted publisher" for this project pointing at owner/repo +
      # workflow filename `release.yml` (see PUBLISHING.md). This step only runs when a
      # release is created; until a trusted publisher is registered it will FAIL rather
      # than publish silently, and releases are maintainer-triggered only.
      if: startsWith(github.ref, 'refs/tags')
      uses: pypa/gh-action-pypi-publish@c1b34028248d0c9f7d90fe29fef2122e2276ff6f  # commit-pinned (immutable SHA; not a floating branch ref)
