# grype scan threshold: --fail-on high --only-fixed (blocks release on actionable high/critical CVEs).
# Thresholds and false-positive exclusions are configured in .grype.yaml at repository root.
name: Publish Python distributions to PyPI

on:
  release:
    types: [created]

permissions:
  contents: read
  actions: read

jobs:
  build-n-publish:
    name: Build and publish Python distributions to PyPI
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        fetch-depth: 0
    - name: Require release commit on main with successful CI
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        RELEASE_COMMIT=$(git rev-parse "$GITHUB_SHA^{commit}")
        git fetch origin main
        git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
        SUCCESSFUL_RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$RELEASE_COMMIT" --status completed --json conclusion --jq 'map(select(.conclusion == "success")) | length')
        test "$SUCCESSFUL_RUNS" -ge 1
    - name: Setup python 3.12
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: 3.12
    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      with:
        version: "0.11.25"
    - name: Install locked privacy/release checks
      run: uv sync --extra dev --locked
    - name: Enforce privacy release gates
      run: |
        uv run --no-sync python scripts/check_sensitive_content.py --require-approved-assets
        uv run --no-sync python scripts/check_ignored_asset_files.py --strict
        uv run --no-sync python scripts/run_semgrep_privacy.py
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine build
    - name: Build a binary wheel and a source tarball
      run: |
        python -m build
    - name: Scan built artifacts with grype
      uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
      id: grype-scan
      with:
        path: dist/
        fail-build: true
        severity-cutoff: high
        output-format: json
        output-file: grype-scan.json
        only-fixed: true
    - name: Upload grype scan results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      if: always()
      with:
        name: grype-release-scan
        path: grype-scan.json
        retention-days: 30
    - name: Publish distribution to PyPI
      if: startsWith(github.ref, 'refs/tags')
      uses: pypa/gh-action-pypi-publish@c1b34028248d0c9f7d90fe29fef2122e2276ff6f  # master
      with:
        password: ${{ secrets.PYPI_DEPLOY_API_KEY }}
