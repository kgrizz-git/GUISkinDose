# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: ci

on:
  - push
  - pull_request

jobs:
  doc-freshness:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Check documentation freshness
      run: python scripts/check_doc_freshness.py

  package-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install build backend
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build sdist and wheel
      run: python -m build

  gui-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e ".[gui]"
    - name: GUI smoke tests
      run: python -m pytest tests/gui/ -v --tb=short

  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,gui]"
    - name: Basedpyright (baseline — fails on new type errors)
      run: basedpyright --baselinefile .basedpyright/baseline.json

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies and audit for CVEs
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,gui]"
        pip-audit --desc on

  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest codecov ruff
        pip install -e .
    - name: Compile check
      run: python -m compileall src/mypyskindose
    - name: Lint with flake8
      run: |
        # Syntax errors and undefined names only; style is enforced by ruff (120 cols).
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Lint with ruff
      run: |
        ruff check src tests
    - name: Test with pytest
      run: |
        coverage run -m pytest --ignore=tests/gui
    - name: Upload coverage to codecov
      run: |
        codecov
