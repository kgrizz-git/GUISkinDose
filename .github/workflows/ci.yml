# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: ci

on:
  - push
  - pull_request

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  doc-freshness:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Check documentation freshness
      run: python scripts/check_doc_freshness.py

  package-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install build backend
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build sdist and wheel
      run: python -m build

  gui-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e ".[gui]"
    - name: GUI smoke tests
      run: python -m pytest tests/gui/ -v --tb=short

  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,gui]"
    - name: Basedpyright (strict — any type error fails)
      run: basedpyright

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies and audit for CVEs
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,gui]"
        pip-audit --desc on
        python scripts/check_licenses.py

  bandit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Bandit (Python SAST, medium+ severity)
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        bandit -c pyproject.toml -r src/mypyskindose scripts --severity-level medium

  matrix-prep:
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.set-matrix.outputs.config }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            CONFIG='{"include":[{"os":"ubuntu-latest","python-version":"3.10"},{"os":"ubuntu-latest","python-version":"3.11"},{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.13"},{"os":"macos-latest","python-version":"3.10"},{"os":"macos-latest","python-version":"3.11"},{"os":"macos-latest","python-version":"3.12"},{"os":"macos-latest","python-version":"3.13"},{"os":"windows-latest","python-version":"3.10"},{"os":"windows-latest","python-version":"3.11"},{"os":"windows-latest","python-version":"3.12"},{"os":"windows-latest","python-version":"3.13"}]}'
          else
            CONFIG='{"include":[{"os":"ubuntu-latest","python-version":"3.12"}]}'
          fi
          echo "config=$CONFIG" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix-prep
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-prep.outputs.config) }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest codecov ruff
        pip install -e .
    - name: Compile check
      run: python -m compileall src/mypyskindose
    - name: Lint with flake8
      run: |
        # Syntax errors and undefined names only; style is enforced by ruff (120 cols).
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Lint with ruff
      run: |
        ruff check src tests
    - name: Test with pytest
      run: |
        coverage run -m pytest --ignore=tests/gui
    - name: Upload coverage to codecov
      run: |
        codecov
