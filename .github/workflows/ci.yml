# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: ci

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    env:
      SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      with:
        version: ">=0.11.19"
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: '3.12'
    # Install the exact versions pinned in uv.lock so PR/main runs are reproducible.
    # `uv sync --locked` fails if uv.lock is stale relative to pyproject.toml. Upstream
    # releases are caught deliberately by the scheduled ci-latest workflow, not by random
    # PRs. `uv sync` writes the environment to ./.venv, which we add to PATH below so the
    # remaining steps invoke the pinned tools without a `uv run` prefix.
    - name: Install dependencies (locked)
      run: uv sync --extra dev --extra gui --locked
    - name: Activate environment
      run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
    - name: Check changelog updated (PR only)
      if: github.event_name == 'pull_request'
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        git fetch --depth=1 origin "$BASE_REF"
        python scripts/check_changelog.py
    - name: Check documentation freshness
      run: python scripts/check_doc_freshness.py
    - name: Check GUI help sync
      run: python scripts/sync_gui_help.py --check
    - name: Check GUI help registry
      run: python scripts/check_help_registry.py
    - name: Check UI copy catalog
      run: python scripts/check_ui_copy.py
    - name: Check feature documentation matrix
      run: python scripts/check_feature_doc_matrix.py
    - name: Check file sizes (<800 lines)
      run: python scripts/check_file_sizes.py
    - name: Check GUI test placement (no nicegui imports outside tests/gui)
      run: python scripts/check_gui_test_placement.py
    - name: Build sdist and wheel
      run: uv build
    - name: Basedpyright (strict — any type error fails)
      run: basedpyright
    - name: Audit dependencies for CVEs and check licenses
      run: |
        python scripts/audit_dependencies.py
        python scripts/check_licenses.py
    - name: Bandit (Python SAST, medium+ severity)
      run: bandit -c pyproject.toml -r src/mypyskindose scripts --severity-level medium
    - name: ShellCheck (shell script lint)
      run: shellcheck run_gui.sh scripts/type_baseline.sh scripts/setup-dev.sh
    - name: Semgrep (OWASP Top 10 SAST)
      run: semgrep --config=p/owasp-top-ten --error --metrics=off src scripts .github/workflows docs/source/conf.py
    - name: Safety (dependency vulnerability scan — skipped without key)
      if: env.SAFETY_API_KEY != ''
      run: safety scan --detailed-output

  gui-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      with:
        version: ">=0.11.19"
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: '3.12'
    # Locked install (see static-analysis). dev+gui gives pytest, pytest-asyncio, and nicegui.
    - name: Install dependencies (locked)
      run: uv sync --extra dev --extra gui --locked
    - name: GUI smoke tests
      run: uv run --no-sync pytest tests/gui/ -v --tb=short

  matrix-prep:
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.set-matrix.outputs.config }}
    steps:
      - id: set-matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == "push" && "$REF" == "refs/heads/main" ]]; then
            # Full Python coverage on ubuntu (cheap); macOS (billed 10x) and Windows
            # (billed 2x) only on the oldest + newest supported Python to bound cost
            # while still catching version- and OS-specific breakage.
            CONFIG='{"include":[{"os":"ubuntu-latest","python-version":"3.10"},{"os":"ubuntu-latest","python-version":"3.11"},{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.13"},{"os":"macos-latest","python-version":"3.10"},{"os":"macos-latest","python-version":"3.13"},{"os":"windows-latest","python-version":"3.10"},{"os":"windows-latest","python-version":"3.13"}]}'
          else
            CONFIG='{"include":[{"os":"ubuntu-latest","python-version":"3.12"}]}'
          fi
          echo "config=$CONFIG" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix-prep
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-prep.outputs.config) }}

    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest codecov ruff
        pip install -e .
    - name: Compile check
      run: python -m compileall src/mypyskindose
    - name: Lint with ruff
      run: |
        ruff check src tests
    - name: Test with pytest
      run: |
        coverage run -m pytest --ignore=tests/gui
    - name: Coverage threshold (≥60%)
      run: coverage report --include="src/mypyskindose/*" --fail-under=60
    - name: Upload coverage to codecov
      run: |
        codecov
