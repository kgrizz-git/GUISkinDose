# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: ci

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,gui]"
        pip install build
    - name: Check documentation freshness
      run: python scripts/check_doc_freshness.py
    - name: Check file sizes (<800 lines)
      run: python scripts/check_file_sizes.py
    - name: Build sdist and wheel
      run: python -m build
    - name: Basedpyright (strict — any type error fails)
      run: basedpyright
    - name: Audit dependencies for CVEs and check licenses
      run: |
        pip-audit --desc on
        python scripts/check_licenses.py
    - name: Bandit (Python SAST, medium+ severity)
      run: bandit -c pyproject.toml -r src/mypyskindose scripts --severity-level medium

  gui-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e ".[gui]"
    - name: GUI smoke tests
      run: python -m pytest tests/gui/ -v --tb=short

  matrix-prep:
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.set-matrix.outputs.config }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            CONFIG='{"include":[{"os":"ubuntu-latest","python-version":"3.10"},{"os":"ubuntu-latest","python-version":"3.11"},{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.13"},{"os":"macos-latest","python-version":"3.10"},{"os":"macos-latest","python-version":"3.11"},{"os":"macos-latest","python-version":"3.12"},{"os":"macos-latest","python-version":"3.13"},{"os":"windows-latest","python-version":"3.10"},{"os":"windows-latest","python-version":"3.11"},{"os":"windows-latest","python-version":"3.12"},{"os":"windows-latest","python-version":"3.13"}]}'
          else
            CONFIG='{"include":[{"os":"ubuntu-latest","python-version":"3.12"}]}'
          fi
          echo "config=$CONFIG" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix-prep
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-prep.outputs.config) }}

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest codecov ruff
        pip install -e .
    - name: Compile check
      run: python -m compileall src/mypyskindose
    - name: Lint with ruff
      run: |
        ruff check src tests
    - name: Test with pytest
      run: |
        coverage run -m pytest --ignore=tests/gui
    - name: Upload coverage to codecov
      run: |
        codecov
