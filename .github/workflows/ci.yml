# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '15 5 * * 0'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
    - id: gate
      env:
        EVENT_NAME: ${{ github.event_name }}
        HEAD_SHA: ${{ github.sha }}
        GH_TOKEN: ${{ github.token }}
      run: |
        if [[ "$EVENT_NAME" != "schedule" ]]; then
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        previous_sha="$(gh api \
          "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?status=completed&per_page=100" \
          --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch")][0].head_sha // empty')"
        if [[ -n "$previous_sha" && "$previous_sha" == "$HEAD_SHA" ]]; then
          echo "should_run=false" >> "$GITHUB_OUTPUT"
        else
          echo "should_run=true" >> "$GITHUB_OUTPUT"
        fi

  static-analysis:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        fetch-depth: 0
    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      with:
        version: ">=0.11.19"
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: '3.12'
    # Install the exact versions pinned in uv.lock so PR/main runs are reproducible.
    # `uv sync --locked` fails if uv.lock is stale relative to pyproject.toml. Upstream
    # releases are caught deliberately by the scheduled ci-latest workflow, not by random
    # PRs. `uv sync` writes the environment to ./.venv, which we add to PATH below so the
    # remaining steps invoke the pinned tools without a `uv run` prefix.
    - name: Install dependencies (locked)
      run: uv sync --extra dev --extra gui --locked
    - name: Activate environment
      run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
    - name: Check changelog updated (PR only)
      if: github.event_name == 'pull_request'
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        git fetch --depth=1 origin "$BASE_REF"
        python scripts/check_changelog.py
    - name: Check documentation freshness
      run: python scripts/check_doc_freshness.py
    - name: Check Sonar configuration scope parity
      run: python scripts/check_sonar_properties.py
    - name: Check sensitive content and approved assets
      run: python scripts/check_sensitive_content.py --require-approved-assets
    - name: Check protected privacy paths and scanner routing policy
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        python scripts/privacy_admission.py check --mode all
        if [ "$EVENT_NAME" = "pull_request" ]; then
          PRIVACY_BASE_REF="origin/$BASE_REF" python scripts/privacy_admission.py route --mode range
        else
          python scripts/privacy_admission.py route --mode all
        fi
    - name: Check PR and push metadata for sensitive content
      run: python scripts/check_ci_metadata.py "$GITHUB_EVENT_PATH"
    - name: Check ignored and untracked risky artifacts
      run: python scripts/check_ignored_asset_files.py --strict
    - name: Check approved asset inventory Markdown
      run: python scripts/render_asset_inventory.py --check
    - name: Check privacy tool inventory and scanner references
      run: python scripts/render_privacy_tool_inventory.py --check
    - name: Check GUI help sync
      run: python scripts/sync_gui_help.py --check
    - name: Check GUI help registry
      run: python scripts/check_help_registry.py
    - name: Check UI copy catalog
      run: python scripts/check_ui_copy.py
    - name: Check feature documentation matrix
      run: python scripts/check_feature_doc_matrix.py
    - name: Check file sizes (<800 lines)
      run: python scripts/check_file_sizes.py
    - name: Check GUI test placement (no nicegui imports outside tests/gui)
      run: python scripts/check_gui_test_placement.py
    - name: Build sdist and wheel
      run: uv build
    - name: Basedpyright (strict — any type error fails)
      run: basedpyright
    - name: Audit dependencies for CVEs and check licenses
      run: |
        python scripts/audit_dependencies.py
        python scripts/check_licenses.py
    - name: Bandit (Python SAST, medium+ severity)
      run: bandit -c pyproject.toml -r src/mypyskindose scripts --severity-level medium
    - name: ShellCheck (shell script lint)
      run: shellcheck run_gui.sh scripts/type_baseline.sh scripts/setup-dev.sh
    - name: Semgrep (OWASP Top 10 SAST)
      run: semgrep --config=p/owasp-top-ten --error --metrics=off src scripts .github/workflows docs/source/conf.py
    - name: Semgrep (project PHI/PII leak rules, blocking)
      run: python scripts/run_semgrep_privacy.py

  gui-smoke:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      with:
        version: ">=0.11.19"
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: '3.12'
    # Locked install (see static-analysis). dev+gui gives pytest, pytest-asyncio, and nicegui.
    - name: Install dependencies (locked)
      run: uv sync --extra dev --extra gui --locked
    - name: GUI smoke tests
      run: uv run --no-sync pytest tests/gui/ -v --tb=short

  matrix-prep:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      config: ${{ steps.set-matrix.outputs.config }}
    steps:
      - id: set-matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # The weekly/manual compatibility sweep covers every supported Python on
            # Ubuntu and the oldest/newest versions on macOS (10x billing) and
            # Windows (2x billing). Keep these expensive runners off the merge path.
            CONFIG='{"include":[{"os":"ubuntu-latest","python-version":"3.11"},{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.13"},{"os":"ubuntu-latest","python-version":"3.14"},{"os":"macos-latest","python-version":"3.11"},{"os":"macos-latest","python-version":"3.14"},{"os":"windows-latest","python-version":"3.11"},{"os":"windows-latest","python-version":"3.14"}]}'
          elif [[ "$EVENT_NAME" == "push" && "$REF" == "refs/heads/main" ]]; then
            # Every merge gets the full supported-version range on inexpensive Ubuntu.
            CONFIG='{"include":[{"os":"ubuntu-latest","python-version":"3.11"},{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.13"},{"os":"ubuntu-latest","python-version":"3.14"}]}'
          else
            # PRs get a current-runtime signal quickly; main and the weekly sweep
            # provide the remaining supported-version and OS coverage.
            CONFIG='{"include":[{"os":"ubuntu-latest","python-version":"3.14"}]}'
          fi
          echo "config=$CONFIG" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix-prep
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-prep.outputs.config) }}

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      with:
        version: ">=0.11.19"
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: ${{ matrix.python-version }}
    # Install the exact versions pinned in uv.lock so PR/main runs are reproducible;
    # unpinned upstream breakage is caught deliberately by ci-latest. `uv run --no-sync`
    # keeps the pinned tools on PATH across every OS (.venv/bin vs .venv/Scripts).
    - name: Install dependencies (locked)
      run: uv sync --extra dev --locked --python ${{ matrix.python-version }}
    - name: Compile check
      run: uv run --no-sync python -m compileall src/mypyskindose
    - name: Lint with ruff
      run: uv run --no-sync ruff check src tests
    - name: Test with pytest
      run: uv run --no-sync coverage run -m pytest --ignore=tests/gui
    - name: Coverage threshold (≥60%)
      run: uv run --no-sync coverage report --include="src/mypyskindose/*" --fail-under=60

  cloud-scans-after-gates:
    name: Main-only external cloud scans
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static-analysis, gui-smoke, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
      SONAR_TOKEN_AVAILABLE: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
    # fetch-depth: 0 gives SonarQube full git history for accurate blame / new-code detection.
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      with:
        version: ">=0.11.19"
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: '3.12'
    # Locked install: pytest + coverage + safety + NiceGUI (GUI tests feed Sonar coverage).
    - name: Install dependencies (locked)
      run: uv sync --extra dev --extra gui --locked
    - name: Generate coverage after all repository gates pass
      run: |
        uv run --no-sync coverage erase
        uv run --no-sync coverage run -m pytest --ignore=tests/gui
        uv run --no-sync coverage run --append -m pytest tests/gui/
        uv run --no-sync coverage xml
    - name: Upload coverage to Codecov (main only)
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
      with:
        files: coverage.xml
    # SonarQube Cloud CI-based analysis (main only). Reads sonar-project.properties for
    # project key, sources, and exclusions. Requires Automatic Analysis to be DISABLED in
    # the SonarCloud project (Administration > Analysis Method) or this step will error.
    # The quality-gate badge tracks whatever this uploads for the main branch.
    - name: SonarQube Cloud scan (main only; skipped without token)
      if: env.SONAR_TOKEN_AVAILABLE == 'true'
      uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8.2.1
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    - name: Run Safety cloud scan (main only; skipped without key)
      if: env.SAFETY_API_KEY != ''
      run: uv run --no-sync safety scan --detailed-output
