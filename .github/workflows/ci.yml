# Job DAG (privacy-first): schedule-gate → privacy-gates → {static-analysis, owasp-semgrep,
# gui-smoke, build, scan-for-secrets (PRs), codeql, coverage-pr (PRs)} → sonar-scan (opt-in protected-main only).
# Safety stays main-only in cloud-scans-main.
#
# External PR scanners that previously ran before privacy-gates:
#   gitleaks.yml — pull_request trigger removed; PR scanning now in the Scan for secrets job below.
#   phi-scan.yml — pull_request trigger removed; weekly schedule + push:main remain.
#   CodeQL       — handled by the codeql job below (needs privacy-gates). If GitHub Default
#                   Setup is enabled in repo settings, disable it: Settings → Security →
#                   Code security → Code scanning → CodeQL → Switch to Advanced.

name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '15 5 * * 0'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
    - id: gate
      env:
        EVENT_NAME: ${{ github.event_name }}
        HEAD_SHA: ${{ github.sha }}
        GH_TOKEN: ${{ github.token }}
      run: |
        if [[ "$EVENT_NAME" != "schedule" ]]; then
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        previous_sha="$(gh api \
          "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?status=completed&per_page=100" \
          --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch")][0].head_sha // empty')"
        if [[ -n "$previous_sha" && "$previous_sha" == "$HEAD_SHA" ]]; then
          echo "should_run=false" >> "$GITHUB_OUTPUT"
        else
          echo "should_run=true" >> "$GITHUB_OUTPUT"
        fi

  privacy-gates:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/privacy-gates.yml

  request-coderabbit:
    # Fires as soon as privacy-gates succeeds (D14) — does not wait for matrix/Sonar.
    needs: [schedule-gate, privacy-gates]
    if: >
      needs.schedule-gate.outputs.should_run == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
    - name: Request CodeRabbit review after privacy-gates
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
      with:
        script: |
          const marker = `<!-- coderabbit-privacy-gate:${context.payload.pull_request.head.sha} -->`;

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          if (comments.some(comment =>
            comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
          )) {
            console.log('CodeRabbit review already requested for this commit.');
            return;
          }

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `@coderabbitai review\n\nPrivacy gate passed for ${context.payload.pull_request.head.sha}.\n\n${marker}`
          });

  static-analysis:
    needs: [schedule-gate, privacy-gates]
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        version: ">=0.11.19"
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'
    # Install the exact versions pinned in uv.lock so PR/main runs are reproducible.
    # `uv sync --locked` fails if uv.lock is stale relative to pyproject.toml. Upstream
    # releases are caught deliberately by the scheduled ci-latest workflow (issue notify), not by random
    # PRs. `uv sync` writes the environment to ./.venv, which we add to PATH below so the
    # remaining steps invoke the pinned tools without a `uv run` prefix.
    - name: Install dependencies (locked)
      run: uv sync --extra dev --extra gui --locked
    - name: Activate environment
      run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
    - name: Check changelog updated (PR only)
      if: github.event_name == 'pull_request'
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        # Full base history so range checks still work after main advances.
        git fetch --no-tags origin "$BASE_REF"
        python scripts/check_changelog.py
    - name: Check documentation freshness
      run: python scripts/check_doc_freshness.py
    - name: Check Sonar configuration scope parity
      run: python scripts/check_sonar_properties.py
    - name: Check cloud scanner sensitive-file exclusions
      run: python scripts/check_cloud_scanner_exclusions.py
    - name: Check GUI help sync
      run: python scripts/sync_gui_help.py --check
    - name: Check GUI help registry
      run: python scripts/check_help_registry.py
    - name: Check UI copy catalog
      run: python scripts/check_ui_copy.py
    - name: Check feature documentation matrix
      run: python scripts/check_feature_doc_matrix.py
    - name: Check file sizes (<800 lines)
      run: python scripts/check_file_sizes.py
    - name: Check GUI test placement (no nicegui imports outside tests/gui)
      run: python scripts/check_gui_test_placement.py
    - name: Build sdist and wheel
      run: uv build
    - name: Basedpyright (strict — any type error fails)
      run: basedpyright
    - name: Audit dependencies for CVEs and check licenses
      run: |
        python scripts/audit_dependencies.py
        python scripts/check_licenses.py
    - name: Bandit (Python SAST, medium+ severity)
      run: bandit -c pyproject.toml -r src/mypyskindose scripts --severity-level medium
    - name: ShellCheck (shell script lint)
      run: shellcheck run_gui.sh scripts/type_baseline.sh scripts/setup-dev.sh

  owasp-semgrep:
    needs: [schedule-gate, privacy-gates]
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        version: ">=0.11.19"
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'
    - name: Install dependencies (locked)
      run: uv sync --extra dev --locked
    - name: Activate environment
      run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
    # Semgrep runs locally. Exclude approved asset/data surfaces even from this SAST pass;
    # the privacy admission gate remains the authoritative full-content check.
    # Semgrep Cloud App stays disabled (--metrics=off; no SEMGREP_APP_TOKEN).
    - name: Semgrep (OWASP Top 10 SAST)
      env:
        SEMGREP_SEND_METRICS: "off"
      run: >-
        semgrep --config=p/owasp-top-ten --error --metrics=off
        --exclude='src/**/example_data/**' --exclude='src/**/phantom_data/**'
        --exclude='src/**/table_data/**' --exclude='tests/fixtures/**'
        src scripts .github/workflows docs/source/conf.py

  gui-smoke:
    needs: [schedule-gate, privacy-gates]
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        version: ">=0.11.19"
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'
    # Locked install (see static-analysis). dev+gui gives pytest, pytest-asyncio, and nicegui.
    - name: Install dependencies (locked)
      run: uv sync --extra dev --extra gui --locked
    - name: GUI smoke tests
      run: uv run --no-sync pytest tests/gui/ -v --tb=short

  matrix-prep:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      config: ${{ steps.set-matrix.outputs.config }}
    steps:
      - id: set-matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # The weekly/manual compatibility sweep covers every supported Python on
            # Ubuntu and the oldest/newest versions on macOS (10x billing) and
            # Windows (2x billing). Keep these expensive runners off the merge path.
            CONFIG='{"include":[{"os":"ubuntu-latest","python-version":"3.11"},{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.13"},{"os":"ubuntu-latest","python-version":"3.14"},{"os":"macos-latest","python-version":"3.11"},{"os":"macos-latest","python-version":"3.14"},{"os":"windows-latest","python-version":"3.11"},{"os":"windows-latest","python-version":"3.14"}]}'
          elif [[ "$EVENT_NAME" == "push" && "$REF" == "refs/heads/main" ]]; then
            # Every merge gets the full supported-version range on inexpensive Ubuntu.
            CONFIG='{"include":[{"os":"ubuntu-latest","python-version":"3.11"},{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.13"},{"os":"ubuntu-latest","python-version":"3.14"}]}'
          else
            # PRs get a current-runtime signal quickly; main and the weekly sweep
            # provide the remaining supported-version and OS coverage.
            CONFIG='{"include":[{"os":"ubuntu-latest","python-version":"3.14"}]}'
          fi
          echo "config=$CONFIG" >> "$GITHUB_OUTPUT"

  build:
    needs: [matrix-prep, privacy-gates]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-prep.outputs.config) }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        version: ">=0.11.19"
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    # Install the exact versions pinned in uv.lock so PR/main runs are reproducible;
    # unpinned upstream breakage is caught deliberately by ci-latest. `uv run --no-sync`
    # keeps the pinned tools on PATH across every OS (.venv/bin vs .venv/Scripts).
    - name: Install dependencies (locked)
      run: uv sync --extra dev --locked --python ${{ matrix.python-version }}
    - name: Compile check
      run: uv run --no-sync python -m compileall src/mypyskindose
    - name: Lint with ruff
      run: uv run --no-sync ruff check src tests
    - name: Test with pytest
      # Cross-version test-pass matrix only (no coverage gate). Coverage is enforced at a single
      # 80% standard by coverage-pr (PRs) and sonar-scan (main); -n auto parallelizes.
      run: uv run --no-sync pytest --ignore=tests/gui -n auto

  coverage-pr:
    # Combined non-GUI + GUI coverage with a patch gate vs origin/main. This is the
    # authoritative PR coverage gate.
    name: PR coverage (combined + diff)
    needs: [schedule-gate, privacy-gates]
    if: >
      needs.schedule-gate.outputs.should_run == 'true' &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
    - name: Fetch base branch for diff-cover
      # Full history (not --depth=1): a shallow tip of the base branch has no
      # merge-base with the PR when main advances after the branch was cut.
      env:
        BASE_REF: ${{ github.base_ref }}
      run: git fetch --no-tags origin "$BASE_REF"
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        version: ">=0.11.19"
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'
    - name: Install dependencies (locked)
      run: uv sync --extra dev --extra gui --locked
    - name: Generate combined coverage (non-GUI + GUI)
      # pytest-cov keeps xdist workers measured; non-GUI runs parallel (-n auto),
      # GUI stays serial (asyncio/nicegui). --cov spans src+scripts+tests so
      # diff-cover sees changed lines in all three.
      run: |
        uv run --no-sync coverage erase
        uv run --no-sync pytest --ignore=tests/gui -n auto \
          --cov=src/mypyskindose --cov=scripts --cov=tests --cov-report=
        uv run --no-sync pytest tests/gui/ \
          --cov=src/mypyskindose --cov=scripts --cov=tests --cov-append --cov-report=
        uv run --no-sync coverage xml
    - name: Combined coverage threshold (≥80%)
      run: uv run --no-sync coverage report --include="src/mypyskindose/*" --fail-under=80
    - name: Diff coverage vs base (≥80% of changed lines)
      env:
        BASE_REF: ${{ github.base_ref }}
      run: >
        uv run --no-sync diff-cover coverage.xml
        --compare-branch="origin/${BASE_REF}"
        --fail-under=80

  sonar-scan:
    name: SonarCloud scan (opt-in protected main only)
    needs: [schedule-gate, privacy-gates, build]
    if: >
      needs.schedule-gate.outputs.should_run == 'true' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.SONAR_PROTECTED_MAIN_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SONAR_TOKEN_AVAILABLE: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
    # fetch-depth: 0 gives SonarQube full git history for accurate blame / new-code detection.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        version: ">=0.11.19"
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'
    - name: Install dependencies (locked)
      run: uv sync --extra dev --extra gui --locked
    - name: Generate combined coverage (non-GUI + GUI)
      # pytest-cov + xdist (see coverage-pr); Sonar reads the resulting coverage.xml.
      run: |
        uv run --no-sync coverage erase
        uv run --no-sync pytest --ignore=tests/gui -n auto \
          --cov=src/mypyskindose --cov=scripts --cov=tests --cov-report=
        uv run --no-sync pytest tests/gui/ \
          --cov=src/mypyskindose --cov=scripts --cov=tests --cov-append --cov-report=
        uv run --no-sync coverage xml
    # CI-based analysis is authoritative (Automatic Analysis disabled). Reads
    # sonar-project.properties. This job stays disabled until a repository administrator
    # protects main and then explicitly sets SONAR_PROTECTED_MAIN_ENABLED=true. It is also
    # skipped when SONAR_TOKEN is absent.
    - name: SonarQube Cloud scan (requires token)
      if: env.SONAR_TOKEN_AVAILABLE == 'true'
      uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8.2.1
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cloud-scans-main:
    name: Main-only Safety scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [privacy-gates, static-analysis, gui-smoke, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        version: ">=0.11.19"
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'
    - name: Install dependencies (locked)
      run: uv sync --extra dev --extra gui --locked
    - name: Run Safety cloud scan (main only; skipped without key)
      if: env.SAFETY_API_KEY != ''
      run: uv run --no-sync safety scan --detailed-output

  gitleaks:
    # PR secret scanning, gated behind privacy-gates. The standalone gitleaks.yml
    # retains push:main only; this job handles all PR branches.
    name: Scan for secrets
    needs: [schedule-gate, privacy-gates]
    if: >
      needs.schedule-gate.outputs.should_run == 'true' &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
    - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    # CodeQL Python SAST, gated behind privacy-gates so it never runs on a PR
    # before privacy admission clears. Runs on PRs and push:main.
    # NOTE: If GitHub Default Setup (code scanning) is enabled in repository settings,
    # disable it to avoid a parallel ungated run: Settings → Security → Code security
    # → Code scanning → CodeQL → Switch to Advanced.
    name: CodeQL analysis (Python)
    needs: [schedule-gate, privacy-gates]
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Initialize CodeQL
      uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
      with:
        languages: python
        # security-and-quality satisfies both branch protection gates:
        #   "Require code scanning results — CodeQL (high or higher)"  [security queries]
        #   "Require code quality results — severity errors"           [quality queries]
        queries: security-and-quality
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
      with:
        category: "/language:python"

  # ── Tracking-issue notification (scheduled/dispatch only, never PRs) ──
  # Mirrors the ci-latest pattern with a distinct marker so the two issue
  # streams stay separate. Never embed raw logs — only job names, SHA, run URL.
  ci-issue-notify:
    name: Open / update tracking issue on failure
    needs: [schedule-gate, privacy-gates, static-analysis, owasp-semgrep,
            gui-smoke, build, coverage-pr, gitleaks, codeql,
            cloud-scans-main, sonar-scan]
    if: >
      always() &&
      needs.schedule-gate.outputs.should_run == 'true' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
    - name: Compose failure summary
      id: summary
      env:
        PRIVACY_GATES: ${{ needs.privacy-gates.result }}
        STATIC_ANALYSIS: ${{ needs.static-analysis.result }}
        OWASP_SEMGREP: ${{ needs.owasp-semgrep.result }}
        GUI_SMOKE: ${{ needs.gui-smoke.result }}
        BUILD: ${{ needs.build.result }}
        COVERAGE_PR: ${{ needs.coverage-pr.result }}
        GITLEAKS: ${{ needs.gitleaks.result }}
        CODEQL: ${{ needs.codeql.result }}
        CLOUD_SCANS_MAIN: ${{ needs.cloud-scans-main.result }}
        SONAR_SCAN: ${{ needs.sonar-scan.result }}
      run: |
        # Count only result == 'failure'. 'skipped' (job gated off — e.g.
        # coverage-pr on push:main, sonar-scan without SONAR_TOKEN) and
        # 'cancelled' (concurrency cancel-in-progress) are non-failures.
        failed=""
        for pair in \
          "privacy-gates:$PRIVACY_GATES" \
          "static-analysis:$STATIC_ANALYSIS" \
          "owasp-semgrep:$OWASP_SEMGREP" \
          "gui-smoke:$GUI_SMOKE" \
          "build:$BUILD" \
          "coverage-pr:$COVERAGE_PR" \
          "gitleaks:$GITLEAKS" \
          "codeql:$CODEQL" \
          "cloud-scans-main:$CLOUD_SCANS_MAIN" \
          "sonar-scan:$SONAR_SCAN"; do
          name="${pair%%:*}"
          result="${pair#*:}"
          if [ "$result" = "failure" ]; then
            failed="${failed:+$failed, }$name"
          fi
        done
        if [ -z "$failed" ]; then
          echo "has_failures=false" >> "$GITHUB_OUTPUT"
        else
          echo "has_failures=true" >> "$GITHUB_OUTPUT"
          echo "failed_jobs=$failed" >> "$GITHUB_OUTPUT"
        fi

    - name: Open or update tracking issue
      if: steps.summary.outputs.has_failures == 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
      env:
        FAILED_JOBS: ${{ steps.summary.outputs.failed_jobs }}
      with:
        script: |
          const marker = '<!-- ci-failure -->';
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
          const sha = context.sha;
          const failedJobs = process.env.FAILED_JOBS;

          const summary = [
            marker,
            '',
            `@${owner} — scheduled/manual \`ci\` reported failures.`,
            '',
            '**This is the pinned (lockfile) CI.** These failures affect PR merges and `main` status.',
            '',
            `**Failed jobs:** ${failedJobs}`,
            '',
            '**Triage commands:**',
            '```',
            `gh run view ${context.runId}`,
            `gh run rerun ${context.runId}`,
            '```',
            '',
            `**Run:** ${runUrl}`,
            `**Commit:** \`${sha}\``,
            '',
            'A later green `ci` run will auto-close this issue.',
          ].join('\n');

          const openIssues = await github.paginate(github.rest.issues.listForRepo, {
            owner,
            repo,
            state: 'open',
            labels: 'github_actions',
            per_page: 100,
          });
          const existing = openIssues.find((issue) =>
            !issue.pull_request && (issue.body || '').includes(marker)
          );

          if (existing) {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: existing.number,
              body: summary,
            });
            core.info(`Updated existing ci issue #${existing.number}`);
            return;
          }

          const issue = await github.rest.issues.create({
            owner,
            repo,
            title: 'ci: pinned CI reported failures',
            body: summary,
            labels: ['github_actions', 'dependencies'],
            assignees: [owner],
          });
          core.info(`Opened ci issue #${issue.data.number}`);

  ci-issue-close:
    name: Close ci tracking issues on success
    needs: [schedule-gate, privacy-gates, static-analysis, owasp-semgrep,
            gui-smoke, build, coverage-pr, gitleaks, codeql,
            cloud-scans-main, sonar-scan]
    if: >
      always() &&
      needs.schedule-gate.outputs.should_run == 'true' &&
      github.event_name != 'pull_request' &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
    - name: Close open ci tracking issues
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
      with:
        script: |
          const marker = '<!-- ci-failure -->';
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

          const openIssues = await github.paginate(github.rest.issues.listForRepo, {
            owner,
            repo,
            state: 'open',
            labels: 'github_actions',
            per_page: 100,
          });
          for (const issue of openIssues) {
            if (issue.pull_request || !(issue.body || '').includes(marker)) {
              continue;
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: `\`ci\` is green again (${runUrl}). Closing this tracking issue.`,
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: 'completed',
            });
            core.info(`Closed ci issue #${issue.number}`);
          }
