# Portable app CI builds (dev-docs/plans/PORTABLE_APP_PLAN.md and PORTABLE_MAC_LINUX_CI_BUILDS_PLAN.md):
# PyInstaller freezes Light and Full on Windows, macOS arm64, and Linux x64. Full bundles a
# pinned sha256-verified Chromium and runs frozen --png-check with a decoy BROWSER_PATH. macOS
# Full puts Chromium under Contents/Helpers, notices under Contents/Resources/chromium, runs
# png-check before and after an ad-hoc inside-out re-sign, and finishes with codesign
# --verify --deep --strict. Linux records ldd soname sets resolved inside vs outside chromium/.
# Windows still blocks outbound network for the app and bundled chrome.exe; Unix records
# network_block=skipped or unshare results. No release signing or notarization. Zips expire
# after seven days as workflow artifacts.
name: portable-spike

on:
  workflow_dispatch:
    inputs:
      macos_intel:
        description: Also build Full on macos-15-intel
        type: boolean
        default: false
  push:
    branches: [ 'spike/portable-*', 'portable/**', 'main' ]
    paths:
      - '.github/workflows/portable-spike.yml'
      - 'packaging/portable/**'
      - 'src/guiskindose/**'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

concurrency:
  group: portable-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-edition:
    name: windows-${{ matrix.edition }}
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        edition: [ light, full ]
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      APP_DIR: tmp/portable/dist/GUISkinDose
      ZIP_NAME: GUISkinDose-${{ matrix.edition }}-windows-x64.zip
      GUISKINDOSE_PORTABLE_EDITION: ${{ matrix.edition }}
      # Pinned Full browser: ungoogled-chromium for Windows x64 (BSD-3-Clause).
      # Bumping it means editing all three values and PORTABLE_CHROMIUM_ARTIFACT.md.
      CHROMIUM_VERSION: 156.0.8078.73-1.1
      CHROMIUM_URL: https://github.com/ungoogled-software/ungoogled-chromium-windows/releases/download/156.0.8078.73-1.1/ungoogled-chromium_156.0.8078.73-1.1_windows_x64.zip
      CHROMIUM_SHA256: 360406931fb55b04ac276bcf409511bd86e4e67e6950029fc45ca5ca63443090
      # selfcheck.OWNED_SUBDIR: the checks write only inside this subfolder.
      SC_SUB: guiskindose-selfcheck
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Setup python 3.14
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.14"
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        version: "0.11.25"
    - name: Install locked runtime + freeze toolchain
      run: uv sync --locked --extra gui-native --group portable

    - name: Unfrozen self-check (reference result)
      run: |
        $out = Join-Path $env:RUNNER_TEMP "selfcheck-unfrozen"
        uv run --no-sync python packaging/portable/entry.py --self-check $out
        if ($LASTEXITCODE -ne 0) { throw "unfrozen self-check failed" }
        $out = Join-Path $out $env:SC_SUB
        $report = Get-Content "$out/selfcheck_report.json" | ConvertFrom-Json
        Write-Output "unfrozen psd_mGy=$($report.calculate_export.psd_mGy) passed=$($report.passed) edition=$($report.edition.edition)"
        # The source tree is always the committed Full edition.
        if ($report.edition.edition -ne 'full') { throw "source tree edition is not full" }
        "UNFROZEN_PSD=$($report.calculate_export.psd_mGy)" >> $env:GITHUB_ENV

    - name: Freeze (PyInstaller onedir, windowed)
      run: |
        $sw = [Diagnostics.Stopwatch]::StartNew()
        uv run --no-sync pyinstaller packaging/portable/guiskindose.spec --noconfirm `
          --distpath tmp/portable/dist --workpath tmp/portable/work
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "BUILD_SECONDS=$([math]::Round($sw.Elapsed.TotalSeconds, 1))" >> $env:GITHUB_ENV
        uv run --no-sync python -c "import PyInstaller; print('PyInstaller', PyInstaller.__version__)"

    - name: Bundle pinned Chromium into the onedir (Full only, fail closed on sha256)
      if: matrix.edition == 'full'
      run: |
        $dl = Join-Path $env:RUNNER_TEMP "chromium-download"
        New-Item -ItemType Directory -Force $dl | Out-Null
        $zip = Join-Path $dl "chromium.zip"
        Invoke-WebRequest -Uri $env:CHROMIUM_URL -OutFile $zip -ErrorAction Stop
        $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actual -ne $env:CHROMIUM_SHA256) { throw "Chromium sha256 mismatch: got $actual" }
        Write-Output "Chromium $env:CHROMIUM_VERSION sha256 verified; zip bytes=$((Get-Item $zip).Length)"
        $unpacked = Join-Path $dl "unpacked"
        7z x $zip "-o$unpacked" | Out-Null
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $top = @(Get-ChildItem $unpacked -Directory)
        if ($top.Count -ne 1) { throw "expected one top-level folder in the Chromium zip" }
        $dest = Join-Path $env:APP_DIR "chromium"
        Move-Item $top[0].FullName $dest
        $chrome = Join-Path $dest "chrome.exe"
        if (-not (Test-Path $chrome)) { throw "chrome.exe missing after unpack" }
        Copy-Item packaging/portable/chromium/LICENSE.chromium.txt, packaging/portable/chromium/LICENSE.ungoogled-chromium-windows.txt $dest
        # The third-party notices are compiled into the binary (chrome://credits). Dump them
        # from this exact build so the shipped CREDITS.html matches what ships.
        $credits = Join-Path $dest "CREDITS.html"
        $line = uv run --no-sync python -I packaging/portable/dump_chromium_credits.py $chrome $credits
        $code = $LASTEXITCODE
        Write-Output $line
        if ($code -ne 0) { throw "chrome://credits dump is missing or a placeholder" }
        $libs = ($line -split 'product_entries=')[1].Split(' ')[0]
        $bfiles = Get-ChildItem $dest -Recurse -File
        "BROWSER_MB=$([math]::Round(($bfiles | Measure-Object Length -Sum).Sum / 1MB, 1))" >> $env:GITHUB_ENV
        "BROWSER_FILES=$($bfiles.Count)" >> $env:GITHUB_ENV
        "CREDITS_PRODUCTS=$libs" >> $env:GITHUB_ENV

    - name: Zip onedir and record sizes
      run: |
        $files = Get-ChildItem $env:APP_DIR -Recurse -File
        $onedir = ($files | Measure-Object Length -Sum).Sum
        New-Item -ItemType Directory -Force out | Out-Null
        7z a -tzip -mx=9 "out/$env:ZIP_NAME" ./tmp/portable/dist/GUISkinDose | Out-Null
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $zip = (Get-Item "out/$env:ZIP_NAME").Length
        $mb = { param($b) [math]::Round($b / 1MB, 1) }
        "ONEDIR_MB=$(& $mb $onedir)" >> $env:GITHUB_ENV
        "ZIP_MB=$(& $mb $zip)" >> $env:GITHUB_ENV
        "ONEDIR_FILES=$($files.Count)" >> $env:GITHUB_ENV
        Write-Output "onedir: $(& $mb $onedir) MB in $($files.Count) files; zip: $(& $mb $zip) MB"
        Write-Output "Largest top-level entries under _internal:"
        Get-ChildItem "$env:APP_DIR/_internal" | ForEach-Object {
          $size = if ($_.PSIsContainer) { (Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum } else { $_.Length }
          [pscustomobject]@{ Name = $_.Name; MB = & $mb $size }
        } | Sort-Object MB -Descending | Select-Object -First 15 | Format-Table -AutoSize | Out-String | Write-Output

    - name: Unzip into a fresh folder (what a user runs)
      run: |
        $dest = Join-Path $env:RUNNER_TEMP "unzipped"
        7z x "out/$env:ZIP_NAME" "-o$dest" | Out-Null
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $exe = Join-Path $dest "GUISkinDose/GUISkinDose.exe"
        if (-not (Test-Path $exe)) { throw "exe missing after unzip" }
        "APP_EXE=$exe" >> $env:GITHUB_ENV

    - name: Block outbound network for the app and prove it
      run: |
        # Control: before the rule, the same probe must reach the network. Otherwise a
        # later "blocked" result would prove nothing about the rule.
        # Retried, because a hosted runner's network can blip.
        $reached = $false
        foreach ($attempt in 1, 2, 3) {
          $control = Join-Path $env:RUNNER_TEMP "netprobe-control-$attempt"
          $proc = Start-Process -FilePath $env:APP_EXE -ArgumentList '--network-probe', "`"$control`"" -Wait -PassThru
          $report = Join-Path $control "$env:SC_SUB/network_probe.json"
          if (-not (Test-Path $report)) {
            Write-Output "control probe $attempt wrote no report (exit=$($proc.ExitCode))"
            Start-Sleep -Seconds 5
            continue
          }
          $result = Get-Content $report | ConvertFrom-Json
          Write-Output "control probe $attempt exit=$($proc.ExitCode) outbound_blocked=$($result.outbound_blocked) error_type=$($result.error_type)"
          if ($proc.ExitCode -eq 0 -and -not $result.outbound_blocked) { $reached = $true; break }
          Start-Sleep -Seconds 5
        }
        if (-not $reached) { throw "control probe could not reach the network in 3 attempts" }
        New-NetFirewallRule -DisplayName "guiskindose-spike-block" -Direction Outbound `
          -Program $env:APP_EXE -Action Block -ErrorAction Stop | Out-Null
        $rule = Get-NetFirewallRule -DisplayName "guiskindose-spike-block" -ErrorAction Stop
        $app = $rule | Get-NetFirewallApplicationFilter
        if ($rule.Enabled -ne 'True' -or $rule.Action -ne 'Block' -or $rule.Direction -ne 'Outbound') {
          throw "firewall rule not active"
        }
        if ($app.Program -ne $env:APP_EXE) { throw "firewall rule targets another program" }
        if ($env:GUISKINDOSE_PORTABLE_EDITION -eq 'full') {
          # Kaleido's browser is a separate program, so it needs its own block rule.
          $chrome = Join-Path (Split-Path $env:APP_EXE) "chromium/chrome.exe"
          New-NetFirewallRule -DisplayName "guiskindose-spike-block-chromium" -Direction Outbound `
            -Program $chrome -Action Block -ErrorAction Stop | Out-Null
          $crule = Get-NetFirewallRule -DisplayName "guiskindose-spike-block-chromium" -ErrorAction Stop
          $cprog = ($crule | Get-NetFirewallApplicationFilter).Program
          if ($crule.Enabled -ne 'True' -or $crule.Action -ne 'Block' -or $cprog -ne $chrome) {
            throw "chromium firewall rule not active"
          }
        }
        # The frozen exe itself must fail an outbound HTTPS request.
        $probe = Join-Path $env:RUNNER_TEMP "netprobe"
        $proc = Start-Process -FilePath $env:APP_EXE -ArgumentList '--network-probe', "`"$probe`"" -Wait -PassThru
        $report = Join-Path $probe "$env:SC_SUB/network_probe.json"
        if (-not (Test-Path $report)) { throw "blocked probe wrote no report (exit=$($proc.ExitCode))" }
        $result = Get-Content $report | ConvertFrom-Json
        Write-Output "network probe exit=$($proc.ExitCode) outbound_blocked=$($result.outbound_blocked) error_type=$($result.error_type)"
        if ($proc.ExitCode -ne 0 -or -not $result.outbound_blocked) { throw "outbound request was not blocked" }

    - name: Frozen self-check (no git on PATH, network blocked)
      run: |
        $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'git.exe')) }) -join ';'
        if (Get-Command git -ErrorAction SilentlyContinue) { throw "git still on PATH" }
        $timings = @()
        foreach ($run in 1, 2) {
          $out = Join-Path $env:RUNNER_TEMP "selfcheck-$run"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $proc = Start-Process -FilePath $env:APP_EXE -ArgumentList '--self-check', "`"$out`"" -Wait -PassThru
          $timings += [math]::Round($sw.Elapsed.TotalSeconds, 1)
          $out = Join-Path $out $env:SC_SUB
          Write-Output "self-check run $run exit=$($proc.ExitCode) wall=$($timings[-1])s"
          if (Test-Path "$out/selfcheck_report.json") { Get-Content "$out/selfcheck_report.json" | Write-Output }
          if ($proc.ExitCode -ne 0) { throw "self-check run $run failed" }
          foreach ($name in 'selfcheck.html', 'selfcheck.json', 'selfcheck_dose_map.csv') {
            if (-not (Test-Path (Join-Path $out $name))) { throw "missing $name" }
          }
          $report = Get-Content "$out/selfcheck_report.json" | ConvertFrom-Json
          if (-not $report.frozen) { throw "self-check did not run frozen" }
          if ($report.git_on_path) { throw "git was visible to the frozen app" }
          if ($report.repo_root_climbs.fun_mesh_manifest_present) { throw "fun-mesh manifest unexpectedly inside the bundle" }
          if ([double]$report.calculate_export.psd_mGy -ne [double]$env:UNFROZEN_PSD) {
            throw "frozen PSD $($report.calculate_export.psd_mGy) != unfrozen $env:UNFROZEN_PSD"
          }
          $ed = $report.edition
          if ($ed.edition -ne $env:GUISKINDOSE_PORTABLE_EDITION) { throw "frozen edition $($ed.edition) != $env:GUISKINDOSE_PORTABLE_EDITION" }
          if ($ed.reduced_1000t_stl -ne 0) { throw "a _reduced_1000t preview was bundled" }
          if ($ed.preview_stem -ne 'adult_male_reduced_3000t') { throw "preview did not resolve to adult_male_reduced_3000t" }
          if (-not $ed.starter_mesh_loads) { throw "starter mesh does not load" }
          if ($env:GUISKINDOSE_PORTABLE_EDITION -eq 'light') {
            if ($ed.png_export_available) { throw "Light reports PNG export available" }
            if ($ed.bundled_browser_present) { throw "Light bundles a browser" }
            if ($ed.png_gate.to_image_calls -ne 0 -or $ed.png_gate.png_returned) { throw "Light reached to_image" }
            if ($ed.non_starter_mesh -ne 'not_installed') { throw "Light did not report a non-starter mesh missing" }
          } else {
            if (-not $ed.png_export_available) { throw "Full reports PNG export off" }
            if (-not $ed.bundled_browser_present) { throw "Full is missing bundled browser layout" }
            if ($ed.non_starter_mesh -ne 'loads') { throw "Full is missing a clinical mesh" }
          }
          # The runner has WebView2, so the native-window pre-check must find it.
          if (-not $report.webview2.applicable -or -not $report.webview2.usable) { throw "WebView2 pre-check found no usable runtime" }
        }
        "WEBVIEW2_VERSION=$($report.webview2.runtime_version)" >> $env:GITHUB_ENV
        "PHANTOM_STLS=$($report.package_data.phantom_data_stl)" >> $env:GITHUB_ENV
        Write-Output "frozen PSD matches unfrozen PSD ($env:UNFROZEN_PSD mGy)"
        "SELFCHECK_COLD_S=$($timings[0])" >> $env:GITHUB_ENV
        "SELFCHECK_WARM_S=$($timings[1])" >> $env:GITHUB_ENV
        Copy-Item (Join-Path $env:RUNNER_TEMP "selfcheck-1/$env:SC_SUB/selfcheck_report.json") out/

    - name: Frozen offline PNG from the bundled Chromium (Full only)
      if: matrix.edition == 'full'
      run: |
        $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'git.exe')) }) -join ';'
        $decoy = Join-Path $env:RUNNER_TEMP "no-such-chrome\chrome.exe"
        $env:BROWSER_PATH = $decoy
        # A missing BROWSER_PATH is a valid decoy because figure_to_png always passes kopts["path"] (src/guiskindose/export/png_browser.py).
        if ($env:BROWSER_PATH -ne $decoy) { throw "BROWSER_PATH decoy was not set" }
        if (Test-Path $env:BROWSER_PATH) { throw "BROWSER_PATH decoy exists on disk" }
        $out = Join-Path $env:RUNNER_TEMP "pngcheck"
        $sw = [Diagnostics.Stopwatch]::StartNew()
        $proc = Start-Process -FilePath $env:APP_EXE -ArgumentList '--png-check', "`"$out`"" -Wait -PassThru
        $wall = [math]::Round($sw.Elapsed.TotalSeconds, 1)
        $report = Join-Path $out "$env:SC_SUB/pngcheck_report.json"
        Write-Output "png-check exit=$($proc.ExitCode) wall=$($wall)s"
        if (Test-Path $report) { Get-Content $report | Write-Output } else { throw "png-check wrote no report" }
        if ($proc.ExitCode -ne 0) { throw "png-check failed" }
        $r = Get-Content $report | ConvertFrom-Json
        if ($r.page.http_script_refs -ne 0) { throw "Kaleido page references an http script" }
        if ($r.render.launched_outside_onedir -ne 0) { throw "a browser outside the onedir launched" }
        # The example export writes the whole-body map and the irradiated-region map.
        if ([int]$r.render.png_images -lt 2) { throw "png-check returned fewer than two PNGs" }
        if ([int]$r.render.png_images -ne [int]$r.render.images) { throw "png-check png count does not match its image count" }
        if ([int]$r.render.png_bytes_total -le 0) { throw "png-check returned empty PNG bytes" }
        $bins = @($r.render.launched_from_onedir)
        if ($bins -notcontains 'chromium/chrome.exe') { throw "bundled chrome.exe not seen" }
        $outsideChromium = @($bins | Where-Object { $_ -notlike 'chromium/*' })
        if ($outsideChromium.Count -ne 0) { throw "png-check browser was $($outsideChromium -join ', ')" }
        "PNG_WALL_S=$wall" >> $env:GITHUB_ENV
        "PNG_IMAGES=$($r.render.png_images)" >> $env:GITHUB_ENV
        "PNG_FLAGS=$($r.render.flags -join ' ')" >> $env:GITHUB_ENV
        Copy-Item $report out/

    - name: Native GUI launch smoke (server up + window child)
      run: |
        $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'git.exe')) }) -join ';'
        $log = Join-Path $env:TEMP "guiskindose/guiskindose-native.log"
        # The self-check runs above wrote this log too; start clean so only this launch counts.
        Remove-Item "$log*" -Force -ErrorAction SilentlyContinue
        if (Test-Path $log) { throw "could not clear the earlier log" }
        $sw = [Diagnostics.Stopwatch]::StartNew()
        $proc = Start-Process -FilePath $env:APP_EXE -PassThru
        $up = $false
        while ($sw.Elapsed.TotalSeconds -lt 120 -and -not $up) {
          Start-Sleep -Milliseconds 500
          $client = New-Object Net.Sockets.TcpClient
          try { $client.Connect('127.0.0.1', 8765); $up = $true } catch { } finally { $client.Dispose() }
          if ($proc.HasExited) { break }
        }
        $startup = [math]::Round($sw.Elapsed.TotalSeconds, 1)
        Start-Sleep -Seconds 15
        $procs = @(Get-Process GUISkinDose -ErrorAction SilentlyContinue)
        Write-Output "server_up=$up seconds=$startup exited=$($proc.HasExited) guiskindose_processes=$($procs.Count)"
        # Summarize the log without printing its lines (they can carry paths or a URL).
        $started = $false
        $ready = $false
        if (Test-Path $log) {
          $lines = @(Get-Content $log)
          $levels = $lines | ForEach-Object { if ($_ -match '\[(DEBUG|INFO|WARNING|ERROR|CRITICAL)\]') { $Matches[1] } } |
            Group-Object | ForEach-Object { "$($_.Name)=$($_.Count)" }
          $started = [bool]($lines | Select-String -SimpleMatch 'Portable GUI starting' -Quiet)
          $ready = [bool]($lines | Select-String -SimpleMatch 'NiceGUI ready' -Quiet)
          Write-Output "log file present: lines=$($lines.Count) levels=[$($levels -join ', ')] startup_logged=$started server_ready_logged=$ready"
        } else { Write-Output "log file missing" }
        $procs | Stop-Process -Force -ErrorAction SilentlyContinue
        "GUI_UP=$up" >> $env:GITHUB_ENV
        "GUI_START_S=$startup" >> $env:GITHUB_ENV
        "GUI_PROCS=$($procs.Count)" >> $env:GITHUB_ENV
        if (-not $up) { throw "GUI server never listened" }
        if (-not (Test-Path $log)) { throw "native log file missing" }
        if ($procs.Count -lt 2) { throw "native window child process not seen" }
        if (-not $started) { throw "log lacks the portable startup line" }
        if (-not $ready) { throw "log lacks the NiceGUI ready line" }

    - name: Summary
      if: always()
      run: |
        $full = $env:GUISKINDOSE_PORTABLE_EDITION -eq 'full'
        $browserRow = if ($full) { "$env:CHROMIUM_VERSION ($env:BROWSER_MB MB, $env:BROWSER_FILES files, $env:CREDITS_PRODUCTS credits entries)" } else { "none" }
        $pngRow = if ($full) { "$env:PNG_WALL_S / $env:PNG_IMAGES / $env:PNG_FLAGS" } else { "n/a" }
        @"
        ## Portable build (Windows, $env:GUISKINDOSE_PORTABLE_EDITION edition)
        | Metric | Value |
        |---|---|
        | Build seconds | $env:BUILD_SECONDS |
        | Onedir size | $env:ONEDIR_MB MB ($env:ONEDIR_FILES files) |
        | Phantom STLs | $env:PHANTOM_STLS |
        | WebView2 runtime seen by the pre-check | $env:WEBVIEW2_VERSION |
        | Zip size | $env:ZIP_MB MB |
        | Unfrozen reference PSD (mGy) | $env:UNFROZEN_PSD |
        | Self-check cold / warm (s) | $env:SELFCHECK_COLD_S / $env:SELFCHECK_WARM_S |
        | GUI server up / seconds / processes | $env:GUI_UP / $env:GUI_START_S / $env:GUI_PROCS |
        | Bundled browser | $browserRow |
        | Offline PNG wall (s) / images / browser flags | $pngRow |
        "@ >> $env:GITHUB_STEP_SUMMARY

    - name: Upload zip and self-check report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: guiskindose-${{ matrix.edition }}-windows-x64
        path: out/
        retention-days: 7
        if-no-files-found: warn
  macos-edition:
    name: macos-${{ matrix.edition }}
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        edition: [ light, full ]
    env:
      APP_BUNDLE: tmp/portable/dist/GUISkinDose.app
      APP_EXE: tmp/portable/dist/GUISkinDose.app/Contents/MacOS/GUISkinDose
      ZIP_NAME: GUISkinDose-${{ matrix.edition }}-macos-arm64.zip
      ARTIFACT_NAME: guiskindose-${{ matrix.edition }}-macos-arm64
      GUISKINDOSE_PORTABLE_EDITION: ${{ matrix.edition }}
      SC_SUB: guiskindose-selfcheck
      CHROMIUM_VERSION: 156.0.8078.79-1.1
      CHROMIUM_URL: https://github.com/ungoogled-software/ungoogled-chromium-macos/releases/download/156.0.8078.79-1.1/ungoogled-chromium_156.0.8078.79-1.1_arm64-macos.dmg
      CHROMIUM_SHA256: 4ff3b084c49d2391aecdd3924ebd1bd7417fb1dd88e3da45891bee73f8e5c173
      NETWORK_BLOCK: skipped
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Require arm64 runner
      run: |
        arch="$(uname -m)"
        echo "runner arch=$arch"
        test "$arch" = arm64
    - name: Setup python 3.14
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.14"
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        version: "0.11.25"
    - name: Install locked runtime + freeze toolchain
      run: uv sync --locked --extra gui-native --group portable
    - name: Unfrozen self-check (reference result)
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/selfcheck-unfrozen"
        uv run --no-sync python packaging/portable/entry.py --self-check "$out"
        report="${out}/${SC_SUB}/selfcheck_report.json"
        psd="$(python3 -c "import json; print(json.load(open('${report}'))['calculate_export']['psd_mGy'])")"
        edition="$(python3 -c "import json; print(json.load(open('${report}'))['edition']['edition'])")"
        echo "unfrozen psd_mGy=${psd} edition=${edition}"
        test "$edition" = full
        echo "UNFROZEN_PSD=${psd}" >> "$GITHUB_ENV"
    - name: Freeze (PyInstaller windowed app bundle)
      run: |
        set -euo pipefail
        start=$SECONDS
        uv run --no-sync pyinstaller packaging/portable/guiskindose.spec --noconfirm \
          --distpath tmp/portable/dist --workpath tmp/portable/work
        echo "BUILD_SECONDS=$((SECONDS - start))" >> "$GITHUB_ENV"
        rm -rf tmp/portable/work
        uv run --no-sync python -c "import PyInstaller; print('PyInstaller', PyInstaller.__version__)"
    - name: Verify PyInstaller ad-hoc seal (Light)
      if: matrix.edition == 'light'
      run: codesign --verify --deep --strict "$APP_BUNDLE"
    - name: Bundle Chromium, notices, png-checks, and ad-hoc re-sign (Full)
      if: matrix.edition == 'full'
      run: packaging/portable/macos_bundle_chromium.sh
    - name: Light must not bundle Chromium.app in Helpers
      if: matrix.edition == 'light'
      run: test ! -d "${APP_BUNDLE}/Contents/Helpers/Chromium.app"
    - name: Zip app bundle and record sizes
      run: |
        set -euo pipefail
        mkdir -p out
        ditto -c -k --keepParent "$APP_BUNDLE" "out/${ZIP_NAME}"
        onedir="$(du -sk "$APP_BUNDLE" | awk '{print $1}')"
        zipb="$(stat -f%z "out/${ZIP_NAME}")"
        echo "ONEDIR_MB=$((onedir / 1024))" >> "$GITHUB_ENV"
        echo "ZIP_MB=$((zipb / 1048576))" >> "$GITHUB_ENV"
    - name: Unzip into a fresh folder
      run: |
        set -euo pipefail
        dest="${RUNNER_TEMP}/unzipped"
        rm -rf "$dest"
        mkdir -p "$dest"
        ditto -x -k "out/${ZIP_NAME}" "$dest"
        exe="${dest}/GUISkinDose.app/Contents/MacOS/GUISkinDose"
        test -x "$exe"
        echo "APP_EXE=${exe}" >> "$GITHUB_ENV"
    - name: Post-resign frozen PNG check on unzipped bundle (Full)
      if: matrix.edition == 'full'
      env:
        PNG_CHECK_LABEL: post_resign
        BROWSER_REL: Helpers/Chromium.app/Contents/MacOS/Chromium
      run: |
        set -euo pipefail
        if ! packaging/portable/macos_frozen_png_check.sh; then
          if [ -f out/pngcheck_report_pre_resign.json ]; then
            echo "adhoc_resign_broke_launch=true"
            echo "adhoc_resign_broke_launch=true" >> "$GITHUB_ENV"
          fi
          exit 1
        fi
        echo "post_png_check=passed"
        echo "POST_PNG_CHECK=passed" >> "$GITHUB_ENV"
    - name: Frozen self-check (no git on PATH)
      run: |
        set -euo pipefail
        # shellcheck source=packaging/portable/strip_git_from_path.sh
        source packaging/portable/strip_git_from_path.sh
        strip_git_from_path
        for run in 1 2; do
          out="${RUNNER_TEMP}/selfcheck-${run}"
          start=$SECONDS
          "$APP_EXE" --self-check "$out"
          wall=$((SECONDS - start))
          report="${out}/${SC_SUB}/selfcheck_report.json"
          python3 - "$report" "$GUISKINDOSE_PORTABLE_EDITION" "$UNFROZEN_PSD" <<'PY'
        import json, sys
        report = json.load(open(sys.argv[1]))
        edition = sys.argv[2]
        unfrozen = float(sys.argv[3])
        assert report["passed"]
        assert report["frozen"]
        assert not report["git_on_path"]
        assert not report["repo_root_climbs"]["fun_mesh_manifest_present"]
        assert float(report["calculate_export"]["psd_mGy"]) == unfrozen
        ed = report["edition"]
        assert ed["edition"] == edition
        assert ed["reduced_1000t_stl"] == 0
        assert ed["preview_stem"] == "adult_male_reduced_3000t"
        assert ed["starter_mesh_loads"]
        assert report["webview2"]["applicable"] is False
        if edition == "light":
            assert not ed["png_export_available"]
            assert not ed["bundled_browser_present"]
            assert ed["png_gate"]["to_image_calls"] == 0
            assert not ed["png_gate"]["png_returned"]
            assert ed["non_starter_mesh"] == "not_installed"
        else:
            assert ed["png_export_available"]
            assert ed["bundled_browser_present"]
            assert ed["non_starter_mesh"] == "loads"
        PY
          echo "self-check run ${run} wall=${wall}s"
          if [ "$run" -eq 1 ]; then
            cp "$report" out/selfcheck_report.json
            echo "PHANTOM_STLS=$(python3 -c "import json; print(json.load(open('${report}'))['package_data']['phantom_data_stl'])")" >> "$GITHUB_ENV"
            echo "SELFCHECK_COLD_S=${wall}" >> "$GITHUB_ENV"
          else
            echo "SELFCHECK_WARM_S=${wall}" >> "$GITHUB_ENV"
          fi
        done
    - name: Native GUI launch smoke (listen on loopback)
      run: |
        set -euo pipefail
        # shellcheck source=packaging/portable/strip_git_from_path.sh
        source packaging/portable/strip_git_from_path.sh
        strip_git_from_path
        log="$(uv run --no-sync python -c "from guiskindose.debug import default_native_log_path; p=default_native_log_path(); import sys; assert p; sys.stdout.write(str(p))")"
        rm -f "${log}"* 2>/dev/null || true
        start=$SECONDS
        # NiceGUI prints its ready line to stdout, and a terminal launch keeps stdout,
        # so the line lands in the console capture rather than the native log.
        console="${RUNNER_TEMP}/gui-console.txt"
        "$APP_EXE" >"$console" 2>&1 &
        pid=$!
        up=false
        while [ $((SECONDS - start)) -lt 120 ]; do
          if nc -z 127.0.0.1 8765 2>/dev/null; then up=true; break; fi
          kill -0 "$pid" 2>/dev/null || break
          sleep 0.5
        done
        startup=$((SECONDS - start))
        started=false
        ready=false
        if $up; then
          log_deadline=$((SECONDS + 15))
          while [ $SECONDS -lt $log_deadline ]; do
            grep -qs 'Portable GUI starting' "$log" && started=true
            grep -qs 'NiceGUI ready' "$log" "$console" && ready=true
            $started && $ready && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.5
          done
        fi
        kill "$pid" 2>/dev/null || true
        wait "$pid" 2>/dev/null || true
        mkdir -p out
        cp "$console" out/gui_console.txt 2>/dev/null || true
        echo "GUI_UP=${up} GUI_START_S=${startup} startup_logged=${started} ready_logged=${ready}"
        echo "GUI_UP=${up}" >> "$GITHUB_ENV"
        echo "GUI_START_S=${startup}" >> "$GITHUB_ENV"
        $up || exit 1
        $started || exit 1
        $ready || exit 1
    - name: Summary
      if: always()
      run: |
        full=$([ "$GUISKINDOSE_PORTABLE_EDITION" = full ] && echo 1 || echo 0)
        {
          echo "## Portable build (macOS arm64, ${GUISKINDOSE_PORTABLE_EDITION} edition)"
          echo "| Metric | Value |"
          echo "|---|---|"
          echo "| Build seconds | ${BUILD_SECONDS:-n/a} |"
          echo "| Onedir size | ${ONEDIR_MB:-n/a} MB |"
          echo "| Zip size | ${ZIP_MB:-n/a} MB |"
          echo "| Phantom STLs | ${PHANTOM_STLS:-n/a} |"
          echo "| Unfrozen reference PSD (mGy) | ${UNFROZEN_PSD:-n/a} |"
          echo "| Self-check cold / warm (s) | ${SELFCHECK_COLD_S:-n/a} / ${SELFCHECK_WARM_S:-n/a} |"
          echo "| GUI server up / seconds | ${GUI_UP:-n/a} / ${GUI_START_S:-n/a} |"
          echo "| Network block | ${NETWORK_BLOCK} |"
          if [ "$full" -eq 1 ]; then
            echo "| Chromium | ${CHROMIUM_VERSION} (${CREDITS_PRODUCTS:-n/a} credits entries) |"
            echo "| Nested verify | ${NESTED_VERIFY:-n/a} |"
            echo "| Outer verify | ${OUTER_VERIFY:-n/a} |"
            echo "| Pre-resign PNG wall / images | ${PRE_PNG_WALL:-n/a} / ${PRE_PNG_IMAGES:-n/a} |"
            echo "| Post-resign PNG wall / images | ${POST_PNG_WALL:-n/a} / ${POST_PNG_IMAGES:-n/a} |"
            echo "| Browser path | Helpers/Chromium.app/Contents/MacOS/Chromium |"
            echo "| Wrapper fds | ${WRAPPER_FDS:-n/a} |"
          else
            echo "| Bundled browser | none |"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload zip and reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: out/
        retention-days: 7
        if-no-files-found: warn
  linux-edition:
    name: linux-${{ matrix.edition }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        edition: [ light, full ]
    env:
      APP_DIR: tmp/portable/dist/GUISkinDose
      APP_EXE: tmp/portable/dist/GUISkinDose/GUISkinDose
      ZIP_NAME: GUISkinDose-${{ matrix.edition }}-linux-x64.zip
      ARTIFACT_NAME: guiskindose-${{ matrix.edition }}-linux-x64
      GUISKINDOSE_PORTABLE_EDITION: ${{ matrix.edition }}
      SC_SUB: guiskindose-selfcheck
      CHROMIUM_VERSION: 156.0.8078.79-1
      CHROMIUM_URL: https://github.com/ungoogled-software/ungoogled-chromium-portablelinux/releases/download/156.0.8078.79-1/ungoogled-chromium-156.0.8078.79-1-x86_64_linux.tar.xz
      CHROMIUM_SHA256: d35a9064068274af1a2efa8bcb9b42306e590f9b5c929789f2e0e51a35880499
      CHROMIUM_BYTES: "157697672"
      NATIVE_GUI: "false"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Record glibc banner
      run: |
        banner="$(ldd --version | head -n 1)"
        echo "glibc=${banner}"
        echo "GLIBC_BANNER=${banner}" >> "$GITHUB_ENV"
    - name: Setup python 3.14
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.14"
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        version: "0.11.25"
    - name: Install locked runtime + freeze toolchain
      run: uv sync --locked --extra gui-native --group portable
    - name: Unfrozen self-check (reference result)
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/selfcheck-unfrozen"
        uv run --no-sync python packaging/portable/entry.py --self-check "$out"
        report="${out}/${SC_SUB}/selfcheck_report.json"
        psd="$(python3 -c "import json; print(json.load(open('${report}'))['calculate_export']['psd_mGy'])")"
        edition="$(python3 -c "import json; print(json.load(open('${report}'))['edition']['edition'])")"
        test "$edition" = full
        echo "UNFROZEN_PSD=${psd}" >> "$GITHUB_ENV"
    - name: Freeze (PyInstaller onedir)
      run: |
        set -euo pipefail
        start=$SECONDS
        uv run --no-sync pyinstaller packaging/portable/guiskindose.spec --noconfirm \
          --distpath tmp/portable/dist --workpath tmp/portable/work
        echo "BUILD_SECONDS=$((SECONDS - start))" >> "$GITHUB_ENV"
        rm -rf tmp/portable/work
    - name: Bundle pinned Chromium and record ldd sonames (Full only)
      if: matrix.edition == 'full'
      run: packaging/portable/linux_bundle_chromium.sh
    - name: Light must not contain a chromium directory
      if: matrix.edition == 'light'
      run: test ! -d "${APP_DIR}/chromium"
    - name: Zip onedir and record sizes
      run: |
        set -euo pipefail
        mkdir -p out
        (cd tmp/portable/dist && zip -rq "../../../out/${ZIP_NAME}" GUISkinDose)
        onedir="$(du -sk "${APP_DIR}" | awk '{print $1}')"
        zipb="$(stat -c%s "out/${ZIP_NAME}")"
        echo "ONEDIR_MB=$((onedir / 1024))" >> "$GITHUB_ENV"
        echo "ZIP_MB=$((zipb / 1048576))" >> "$GITHUB_ENV"
    - name: Unzip into a fresh folder
      run: |
        set -euo pipefail
        dest="${RUNNER_TEMP}/unzipped"
        rm -rf "$dest"
        mkdir -p "$dest"
        unzip -q "out/${ZIP_NAME}" -d "$dest"
        exe="${dest}/GUISkinDose/GUISkinDose"
        test -x "$exe"
        echo "APP_EXE=${exe}" >> "$GITHUB_ENV"
    - name: Network probe (optional user namespace)
      run: |
        set -euo pipefail
        probe="${RUNNER_TEMP}/netprobe"
        namespace=unavailable
        if unshare --net true 2>/dev/null; then
          unshare --net "$APP_EXE" --network-probe "$probe"
          blocked="$(python3 -c "import json; print(json.load(open('${probe}/${SC_SUB}/network_probe.json'))['outbound_blocked'])")"
          if [ "$blocked" = "True" ]; then
            namespace=blocked
          else
            namespace=available
          fi
        else
          "$APP_EXE" --network-probe "$probe" || true
        fi
        echo "NETWORK_NAMESPACE=${namespace}" >> "$GITHUB_ENV"
    - name: Frozen self-check (no git on PATH)
      run: |
        set -euo pipefail
        # shellcheck source=packaging/portable/strip_git_from_path.sh
        source packaging/portable/strip_git_from_path.sh
        strip_git_from_path
        for run in 1 2; do
          out="${RUNNER_TEMP}/selfcheck-${run}"
          start=$SECONDS
          "$APP_EXE" --self-check "$out"
          wall=$((SECONDS - start))
          report="${out}/${SC_SUB}/selfcheck_report.json"
          python3 - "$report" "$GUISKINDOSE_PORTABLE_EDITION" "$UNFROZEN_PSD" <<'PY'
        import json, sys
        report = json.load(open(sys.argv[1]))
        edition = sys.argv[2]
        unfrozen = float(sys.argv[3])
        assert report["passed"] and report["frozen"] and not report["git_on_path"]
        assert not report["repo_root_climbs"]["fun_mesh_manifest_present"]
        assert float(report["calculate_export"]["psd_mGy"]) == unfrozen
        ed = report["edition"]
        assert ed["edition"] == edition
        assert ed["reduced_1000t_stl"] == 0
        assert ed["preview_stem"] == "adult_male_reduced_3000t"
        assert ed["starter_mesh_loads"]
        assert report["webview2"]["applicable"] is False
        if edition == "light":
            assert not ed["png_export_available"] and not ed["bundled_browser_present"]
            assert ed["png_gate"]["to_image_calls"] == 0
            assert not ed["png_gate"]["png_returned"]
            assert ed["non_starter_mesh"] == "not_installed"
        else:
            assert ed["png_export_available"] and ed["bundled_browser_present"]
            assert ed["non_starter_mesh"] == "loads"
        PY
          if [ "$run" -eq 1 ]; then
            cp "$report" out/selfcheck_report.json
            echo "SELFCHECK_COLD_S=${wall}" >> "$GITHUB_ENV"
            echo "PHANTOM_STLS=$(python3 -c "import json; print(json.load(open('${report}'))['package_data']['phantom_data_stl'])")" >> "$GITHUB_ENV"
          else
            echo "SELFCHECK_WARM_S=${wall}" >> "$GITHUB_ENV"
          fi
        done
    - name: Frozen offline PNG from bundled Chromium (Full only)
      if: matrix.edition == 'full'
      run: |
        set -euo pipefail
        # shellcheck source=packaging/portable/strip_git_from_path.sh
        source packaging/portable/strip_git_from_path.sh
        strip_git_from_path
        export BROWSER_PATH="${RUNNER_TEMP}/no-such-chrome/chrome"
        out="${RUNNER_TEMP}/pngcheck"
        display=none
        start=$SECONDS
        set +e
        ns="${NETWORK_NAMESPACE:-unavailable}"
        if [ "$ns" = "blocked" ]; then
          unshare --net "$APP_EXE" --png-check "$out"
        else
          "$APP_EXE" --png-check "$out"
        fi
        code=$?
        if [ "$code" -ne 0 ] && [ "${LINUX_NOT_FOUND_COUNT:-0}" -eq 0 ]; then
          if command -v xvfb-run >/dev/null; then
            display=xvfb
            if [ "$ns" = "blocked" ]; then
              unshare --net xvfb-run -a "$APP_EXE" --png-check "$out"
            else
              xvfb-run -a "$APP_EXE" --png-check "$out"
            fi
            code=$?
          fi
        fi
        set -e
        echo "DISPLAY_HELPER=${display}" >> "$GITHUB_ENV"
        report="${out}/${SC_SUB}/pngcheck_report.json"
        if [ "$code" -ne 0 ]; then
          # The failure code and counts are labels and integers, never paths.
          if [ -f "$report" ]; then
            python3 -c 'import json, sys; r = json.load(open(sys.argv[1]))["render"]; print("png_check_failure", r.get("error_type"), r.get("code"), r.get("counts"))' "$report" || true
          fi
          exit 1
        fi
        wall=$((SECONDS - start))
        test -f "$report"
        python3 - "$report" <<'PY'
        import json, sys
        data = json.load(open(sys.argv[1]))
        render, page = data["render"], data["page"]
        assert data.get("passed")
        assert page["http_script_refs"] == 0
        assert render["launched_outside_onedir"] == 0
        assert render["png_images"] >= 2 and render["png_images"] == render["images"]
        assert render["png_bytes_total"] > 0
        assert "chromium/chrome" in render["launched_from_onedir"]
        PY
        cp "$report" out/pngcheck_report.json
        echo "PNG_WALL_S=${wall}" >> "$GITHUB_ENV"
        echo "PNG_IMAGES=$(python3 -c "import json; print(json.load(open('${report}'))['render']['png_images'])")" >> "$GITHUB_ENV"
    - name: Summary
      if: always()
      run: |
        full=$([ "$GUISKINDOSE_PORTABLE_EDITION" = full ] && echo 1 || echo 0)
        {
          echo "## Portable build (Linux x64, ${GUISKINDOSE_PORTABLE_EDITION} edition)"
          echo "| Metric | Value |"
          echo "|---|---|"
          echo "| glibc | ${GLIBC_BANNER:-n/a} |"
          echo "| Build seconds | ${BUILD_SECONDS:-n/a} |"
          echo "| Onedir size | ${ONEDIR_MB:-n/a} MB |"
          echo "| Zip size | ${ZIP_MB:-n/a} MB |"
          echo "| native GUI | ${NATIVE_GUI} |"
          echo "| Network namespace | ${NETWORK_NAMESPACE:-n/a} |"
          echo "| Display helper | ${DISPLAY_HELPER:-n/a} |"
          if [ "$full" -eq 1 ]; then
            echo "| Chromium | ${CHROMIUM_VERSION} |"
            echo "| Bundled soname count | ${LINUX_BUNDLED_COUNT:-n/a} |"
            echo "| System soname count | ${LINUX_SYSTEM_COUNT:-n/a} |"
            echo "| Not-found soname count | ${LINUX_NOT_FOUND_COUNT:-n/a} |"
            echo "| PNG wall / images | ${PNG_WALL_S:-n/a} / ${PNG_IMAGES:-n/a} |"
            echo "| Browser path | chromium/chrome |"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload zip and reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: out/
        retention-days: 7
        if-no-files-found: warn

