name: Presidio (secondary privacy review)

on:
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presidio:
    name: Value-suppressed local NLP scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.11.25"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned local scanner and language model
        run: uv sync --group privacy-scan --locked
      - name: Run Presidio without person-name NLP or report upload
        run: >-
          uv run --no-sync python scripts/run_presidio_advisory.py
          --fail-on-findings --max-displayed-findings 100
