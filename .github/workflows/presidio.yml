name: Presidio (secondary privacy review)

on:
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presidio:
    name: Value-suppressed local NLP scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.25"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned local scanner and language model
        run: uv sync --extra privacy-scan --locked
      - name: Run Presidio without person-name NLP or report upload
        run: >-
          uv run --no-sync python scripts/run_presidio_advisory.py
          --fail-on-findings --max-displayed-findings 100
