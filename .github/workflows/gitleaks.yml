# Secret scanning with Gitleaks (Harness — supply-chain hygiene).
# https://github.com/gitleaks/gitleaks-action
#
# PR scanning has been intentionally moved into ci.yml as a job that needs
# [schedule-gate, privacy-gates], so Gitleaks never runs on a PR before the
# privacy admission gate passes. This file retains the post-merge push:main
# check only (code reaching main has already cleared PR CI).

name: gitleaks

on:
  push:
    branches: [ main ]

jobs:
  gitleaks:
    name: Scan for secrets (post-merge)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
