# Secret scanning with Gitleaks (Harness — supply-chain hygiene).
# https://github.com/gitleaks/gitleaks-action

name: gitleaks

# Scope push to main only; PR branches are covered by the pull_request trigger,
# so a push to a branch that has an open PR is not scanned twice.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
