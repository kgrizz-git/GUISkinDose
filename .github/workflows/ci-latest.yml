# Deliberately probes the LATEST released versions of dependencies (ignoring uv.lock).
#
# The main `ci` workflow installs from uv.lock so PR/main runs are reproducible and a
# random upstream release cannot turn an unrelated PR red. The trade-off is that upstream
# breakage (e.g. a new nicegui tightening its type annotations) would otherwise go
# unnoticed until someone bumps the lock. This workflow closes that gap: it runs on a
# weekly schedule (and on demand) with an unpinned install.
#
# Failures are advisory for branch status: probe steps use continue-on-error so a broken
# upstream release does not paint `main` red. Instead the workflow opens (or updates) a
# GitHub issue that @-mentions the repository owner so maintainers are notified, then you
# can fix the code and bump uv.lock deliberately (`uv lock --upgrade`). A later green run
# auto-closes open ci-latest tracking issues.

name: ci-latest

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-latest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hook-release-monitor:
    # Metadata-only, separate from the job that executes unpinned third-party tools.
    # No checkout or dependency installation; the token never enters repository code.
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    steps:
    - name: Track newer Gitleaks hook releases
      id: hook_release_check
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
      with:
        script: |
          const { owner, repo } = context.repo;
          const marker = '<!-- gitleaks-hook-version-drift -->';
          const { data: config } = await github.rest.repos.getContent({
            owner, repo, path: '.pre-commit-config.yaml', ref: context.sha,
          });
          if (config.type !== 'file' || config.encoding !== 'base64') {
            throw new Error('Hook configuration response is invalid.');
          }
          const text = Buffer.from(config.content, 'base64').toString('utf8');
          const match = text.match(/repo: https:\/\/github\.com\/gitleaks\/gitleaks\s+rev: (v\d+\.\d+\.\d+)\s/);
          if (!match) throw new Error('Pinned Gitleaks hook version is missing.');
          const pinned = match[1];
          const { data: release } = await github.rest.repos.getLatestRelease({ owner: 'gitleaks', repo: 'gitleaks' });
          if (!/^v\d+\.\d+\.\d+$/.test(release.tag_name)) {
            throw new Error('Gitleaks release version is invalid.');
          }
          const latest = release.tag_name;
          const left = latest.slice(1).split('.').map(Number);
          const right = pinned.slice(1).split('.').map(Number);
          const firstDifferent = left.findIndex((value, index) => value !== right[index]);
          const newer = firstDifferent >= 0 && left[firstDifferent] > right[firstDifferent];
          const issues = await github.paginate(github.rest.issues.listForRepo, {
            owner, repo, state: 'open', labels: 'dependencies', per_page: 100,
          });
          const owned = marker => issues.filter(issue => !issue.pull_request &&
            issue.user?.login === 'github-actions[bot]' && (issue.body || '').includes(marker));
          const existing = owned(marker);
          for (const issue of owned('<!-- gitleaks-hook-monitor-failure -->')) {
            await github.rest.issues.update({ owner, repo, issue_number: issue.number,
              state: 'closed', state_reason: 'completed' });
          }
          if (!newer) {
            for (const issue of existing) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number,
                state: 'closed', state_reason: 'completed' });
            }
            core.info('Gitleaks hook is current.');
            return;
          }
          const body = [marker, '', `Pinned Gitleaks hook: ${pinned}; latest stable release: ${latest}.`,
            '', 'Update the hook in a feature branch and review the resulting changes:',
            '```', 'pre-commit autoupdate --repo https://github.com/gitleaks/gitleaks',
            'pre-commit run gitleaks --all-files', '```',
            'Run the normal commit/push gates before publishing a PR. This monitor never edits pins or bypasses hooks.',
          ].join('\n');
          if (existing.length) {
            if (existing[0].body !== body) {
              await github.rest.issues.update({ owner, repo, issue_number: existing[0].number, body });
            }
            for (const duplicate of existing.slice(1)) {
              await github.rest.issues.update({ owner, repo, issue_number: duplicate.number,
                state: 'closed', state_reason: 'completed' });
            }
          } else {
            await github.rest.issues.create({ owner, repo, title: 'Update pinned Gitleaks git hook',
              body, labels: ['dependencies'] });
          }

    - name: Report hook monitor failure
      if: failure() && steps.hook_release_check.outcome == 'failure'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
      with:
        script: |
          const { owner, repo } = context.repo;
          const marker = '<!-- gitleaks-hook-monitor-failure -->';
          const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
          const body = [marker, '', 'The metadata-only Gitleaks hook release check failed.',
            'Check upstream availability, hook tag format, and API permissions before rerunning ci-latest on main.',
            `Run: ${runUrl}`, 'No hook pin was changed. A later successful metadata check closes this issue.',
          ].join('\n');
          const issues = await github.paginate(github.rest.issues.listForRepo, {
            owner, repo, state: 'open', labels: 'dependencies', per_page: 100,
          });
          const existing = issues.filter(issue => !issue.pull_request &&
            issue.user?.login === 'github-actions[bot]' && (issue.body || '').includes(marker));
          if (existing.length) {
            if (existing[0].body !== body) {
              await github.rest.issues.update({ owner, repo, issue_number: existing[0].number, body });
            }
            for (const duplicate of existing.slice(1)) {
              await github.rest.issues.update({ owner, repo, issue_number: duplicate.number,
                state: 'closed', state_reason: 'completed' });
            }
          } else {
            await github.rest.issues.create({ owner, repo, title: 'Gitleaks hook release monitor failed',
              body, labels: ['dependencies'] });
          }

  latest-deps:
    runs-on: ubuntu-latest
    steps:
    # persist-credentials: false matters more here than in any other workflow. This job
    # deliberately installs UNPINNED upstream releases and runs the newest Semgrep with a
    # ruleset fetched from its registry, so it executes third-party code nobody reviewed.
    # Leaving the checkout token in `.git/config` would put a credential carrying
    # `issues: write` within reach of that code. Nothing here pushes or fetches, and
    # github-script authenticates through its own `github.token`, so dropping it costs
    # nothing. Every checkout in this repository now sets it; this job is just the one
    # where it earns its keep.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    # Required by the two semgrep probes below, which need `uvx` to fetch the newest
    # release. `uv` is not part of the ubuntu runner image, and the unpinned
    # `pip install -e ".[dev,gui]"` below does not provide semgrep either (it is
    # deliberately not a project dependency). Without this, both probes *and* the pytest
    # step would fail every Monday with "semgrep could not be resolved" and open a drift
    # issue that has nothing to do with drift: the privacy-rules and semgrep-tool tests
    # resolve the scanner too, and deliberately refuse to skip when it is missing.
    #
    # Not continue-on-error, because this is setup rather than a probe. The accepted
    # consequence is that a failure here turns the run red without opening a tracking
    # issue, since the open-issue condition below inspects only the probe steps — which
    # would be `skipped`.
    - name: Install uv (needed by the semgrep probes and the test suite)
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      with:
        version: ">=0.11.19"
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.14'
    # Every probe below tees its output into $RUNNER_TEMP/ci-latest/<step id>.log and ends
    # the log with "[exit code N]" on a line of its own (the leading \n covers output that
    # stopped mid-line), so the issue step can quote what actually failed rather than only
    # which step did (scripts/ci_latest_report.py builds that section).
    #
    # The install goes into ./.venv on purpose: pyproject.toml pins basedpyright to
    # `venv = ".venv"`, and against a bare runner Python it exits 3 ("venv .venv
    # subdirectory not found") with "0 errors" — a configuration failure that looked like
    # type-stub drift in every tracking issue. $GITHUB_PATH puts .venv/bin first for every
    # later step. Tests reach uv only through `uv run --no-sync` or the isolated
    # tools/semgrep project, so nothing re-syncs this environment back to uv.lock.
    - name: Install latest dependencies (unpinned — NOT from uv.lock)
      id: install
      continue-on-error: true
      shell: bash
      run: |
        set +e
        log_dir="$RUNNER_TEMP/ci-latest"
        mkdir -p "$log_dir"
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
        {
          python -m venv .venv &&
          .venv/bin/python -m pip install --upgrade pip &&
          .venv/bin/python -m pip install -e ".[dev,gui]"
        } 2>&1 | tee "$log_dir/install.log"
        rc=${PIPESTATUS[0]}
        printf '\n[exit code %s]\n' "$rc" >> "$log_dir/install.log"
        exit "$rc"
    - name: Show resolved versions
      if: steps.install.outcome == 'success'
      run: pip freeze | tee "$RUNNER_TEMP/ci-latest/freeze.txt"
    - name: Basedpyright (strict — catches type-stub drift)
      id: basedpyright
      if: steps.install.outcome == 'success'
      continue-on-error: true
      shell: bash
      run: |
        set +e
        basedpyright 2>&1 | tee "$RUNNER_TEMP/ci-latest/basedpyright.log"
        rc=${PIPESTATUS[0]}
        printf '\n[exit code %s]\n' "$rc" >> "$RUNNER_TEMP/ci-latest/basedpyright.log"
        exit "$rc"
    - name: GUI test placement (core suite collects with nicegui blocked)
      id: gui_placement
      if: steps.install.outcome == 'success'
      continue-on-error: true
      shell: bash
      run: |
        set +e
        python scripts/check_gui_test_placement.py 2>&1 | tee "$RUNNER_TEMP/ci-latest/gui_placement.log"
        rc=${PIPESTATUS[0]}
        printf '\n[exit code %s]\n' "$rc" >> "$RUNNER_TEMP/ci-latest/gui_placement.log"
        exit "$rc"
    # Semgrep is pinned in dev-docs/privacy_tool_inventory.json and deliberately kept out
    # of uv.lock, so Dependabot cannot bump it. These two probes are the only thing that
    # catches a pin drifting behind upstream or a new release breaking a gate. ci.yml runs
    # the pinned version and stays authoritative. Both need continue-on-error like every
    # other probe here, or a semgrep failure aborts the run before pytest.
    - name: Semgrep OWASP scan against the LATEST semgrep (pin drift probe)
      id: semgrep_owasp
      if: steps.install.outcome == 'success'
      continue-on-error: true
      env:
        GUISKINDOSE_SEMGREP_UNPINNED: "1"
      shell: bash
      run: |
        set +e
        python scripts/run_semgrep_owasp.py 2>&1 | tee "$RUNNER_TEMP/ci-latest/semgrep_owasp.log"
        rc=${PIPESTATUS[0]}
        printf '\n[exit code %s]\n' "$rc" >> "$RUNNER_TEMP/ci-latest/semgrep_owasp.log"
        exit "$rc"

    # The privacy ruleset is project-local (.semgrep/), so it is *more* exposed to a
    # semgrep parser or behaviour change than the upstream OWASP pack, not less.
    - name: Privacy Semgrep against the LATEST semgrep (pin drift probe)
      id: semgrep_privacy
      if: steps.install.outcome == 'success'
      continue-on-error: true
      env:
        GUISKINDOSE_SEMGREP_UNPINNED: "1"
      shell: bash
      run: |
        set +e
        python scripts/run_semgrep_privacy.py 2>&1 | tee "$RUNNER_TEMP/ci-latest/semgrep_privacy.log"
        rc=${PIPESTATUS[0]}
        printf '\n[exit code %s]\n' "$rc" >> "$RUNNER_TEMP/ci-latest/semgrep_privacy.log"
        exit "$rc"

    - name: Full test suite (core + gui) against latest deps
      id: pytest
      if: steps.install.outcome == 'success'
      continue-on-error: true
      shell: bash
      run: |
        set +e
        python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/ci-latest/pytest.log"
        rc=${PIPESTATUS[0]}
        printf '\n[exit code %s]\n' "$rc" >> "$RUNNER_TEMP/ci-latest/pytest.log"
        exit "$rc"
    # Standard-library script run by setup-python's interpreter, so it still works when the
    # unpinned install (and with it .venv) failed. continue-on-error: a broken report must
    # never stop the issue from being filed; the issue step falls back to step names only.
    - name: Summarize probe failures for the tracking issue
      id: report
      if: >
        always() &&
        (steps.install.outcome == 'failure' ||
         steps.basedpyright.outcome == 'failure' ||
         steps.gui_placement.outcome == 'failure' ||
         steps.semgrep_owasp.outcome == 'failure' ||
         steps.semgrep_privacy.outcome == 'failure' ||
         steps.pytest.outcome == 'failure')
      continue-on-error: true
      env:
        OUTCOMES: >-
          install=${{ steps.install.outcome }}
          basedpyright=${{ steps.basedpyright.outcome }}
          gui_placement=${{ steps.gui_placement.outcome }}
          semgrep_owasp=${{ steps.semgrep_owasp.outcome }}
          semgrep_privacy=${{ steps.semgrep_privacy.outcome }}
          pytest=${{ steps.pytest.outcome }}
      shell: bash
      run: |
        failed=""
        for pair in $OUTCOMES; do
          if [[ "${pair#*=}" == failure ]]; then failed+="${pair%%=*},"; fi
        done
        "$pythonLocation/bin/python" scripts/ci_latest_report.py \
          --log-dir "$RUNNER_TEMP/ci-latest" --failed "$failed" \
          --workspace "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/ci-latest/report.md"
    - name: Open issue and notify on failure
      if: >
        always() &&
        (steps.install.outcome == 'failure' ||
         steps.basedpyright.outcome == 'failure' ||
         steps.gui_placement.outcome == 'failure' ||
         steps.semgrep_owasp.outcome == 'failure' ||
         steps.semgrep_privacy.outcome == 'failure' ||
         steps.pytest.outcome == 'failure')
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
      env:
        INSTALL_OUTCOME: ${{ steps.install.outcome }}
        BASEDPRIGHT_OUTCOME: ${{ steps.basedpyright.outcome }}
        GUI_PLACEMENT_OUTCOME: ${{ steps.gui_placement.outcome }}
        SEMGREP_OWASP_OUTCOME: ${{ steps.semgrep_owasp.outcome }}
        SEMGREP_PRIVACY_OUTCOME: ${{ steps.semgrep_privacy.outcome }}
        PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
        REPORT_PATH: ${{ runner.temp }}/ci-latest/report.md
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- ci-latest-failure -->';
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
          const sha = context.sha;
          const failed = [
            ['install', process.env.INSTALL_OUTCOME],
            ['basedpyright', process.env.BASEDPRIGHT_OUTCOME],
            ['gui_placement', process.env.GUI_PLACEMENT_OUTCOME],
            ['semgrep_owasp', process.env.SEMGREP_OWASP_OUTCOME],
            ['semgrep_privacy', process.env.SEMGREP_PRIVACY_OUTCOME],
            ['pytest', process.env.PYTEST_OUTCOME],
          ].filter(([, outcome]) => outcome === 'failure').map(([name]) => name);

          const stepGuidance = {
            install: {
              summary: 'unpinned `pip install` failed — likely an upstream release broke installation',
              action: 're-run **ci-latest** Monday; if still red, pin the offending dep in `pyproject.toml`',
            },
            basedpyright: {
              summary: 'basedpyright reported type errors, or could not run at all (the exit code below says which)',
              action: 'exit code 1: fix the reported errors; any other code: fix the environment or config. Reproduce in a fresh venv with `pip install -e ".[dev,gui]" && basedpyright`',
            },
            gui_placement: {
              summary: 'GUI test placement check failed under unpinned deps',
              action: 'reproduce with `python scripts/check_gui_test_placement.py`; fix or move the test',
            },
            semgrep_owasp: {
              summary: 'the newest semgrep broke the OWASP gate, or the pinned version has drifted behind',
              action: 'reproduce with `GUISKINDOSE_SEMGREP_UNPINNED=1 python scripts/run_semgrep_owasp.py`; then bump or hold the pin in `dev-docs/privacy_tool_inventory.json`',
            },
            semgrep_privacy: {
              summary: 'the newest semgrep broke the project privacy ruleset in `.semgrep/`',
              action: 'reproduce with `GUISKINDOSE_SEMGREP_UNPINNED=1 python scripts/run_semgrep_privacy.py`; fix the rules or hold the pin',
            },
            pytest: {
              summary: 'tests failed against the newest dependencies',
              action: 'reproduce in a fresh venv with `pip install -e ".[dev,gui]" && python -m pytest -q` (serial, like this job); compare with the locked `uv run pytest`',
            },
          };

          const guidanceLines = failed.map(name => {
            const g = stepGuidance[name];
            return g ? `- **${name}** — ${g.summary}\n  → ${g.action}` : `- **${name}** — unknown step (see run log)`;
          }).join('\n');

          // Written by scripts/ci_latest_report.py; absent if that step failed.
          let report = '';
          try {
            report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
          } catch (error) {
            report = '_The failure summary was not generated; see the run log._';
          }

          const summary = [
            marker,
            '',
            `@${owner} — scheduled/manual \`ci-latest\` reported probe failures.`,
            '',
            '**This is the unpinned-deps canary**, *not* the lockfile. The lockfile and PR CI are unaffected.',
            '`ci.yml` (pinned, blocking) is authoritative; `ci-latest` is the early warning.',
            '',
            '**Failed steps + what to do:**',
            '',
            guidanceLines,
            '',
            report,
            '',
            '**Default:** a one-off failure often clears when upstream ships a fix by next Monday.',
            'If the same step fails two Mondays running, it will not clear on its own: fix it, or pin the dependency.',
            '',
            '**Triage commands:**',
            '```',
            `gh run view ${context.runId}`,
            `gh run view ${context.runId} --log | grep -A5 -E 'FAIL|ERROR|fail'`,
            `gh run rerun ${context.runId}     # only after you've decided to act`,
            '```',
            '',
            `**Run:** ${runUrl}`,
            `**Commit:** \`${sha}\``,
            '',
            'A later green `ci-latest` run will auto-close this issue.',
          ].join('\n');

          const openIssues = await github.paginate(github.rest.issues.listForRepo, {
            owner,
            repo,
            state: 'open',
            labels: 'github_actions',
            per_page: 100,
          });
          const existing = openIssues.find((issue) =>
            !issue.pull_request && (issue.body || '').includes(marker)
          );

          if (existing) {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: existing.number,
              body: summary,
            });
            core.info(`Updated existing ci-latest issue #${existing.number}`);
            return;
          }

          const issue = await github.rest.issues.create({
            owner,
            repo,
            title: 'ci-latest: latest-dependency probe failed',
            body: summary,
            labels: ['github_actions', 'dependencies'],
            assignees: [owner],
          });
          core.info(`Opened ci-latest issue #${issue.data.number}`);

    - name: Close ci-latest tracking issues on success
      if: >
        always() &&
        steps.install.outcome == 'success' &&
        steps.basedpyright.outcome == 'success' &&
        steps.gui_placement.outcome == 'success' &&
        steps.semgrep_owasp.outcome == 'success' &&
        steps.semgrep_privacy.outcome == 'success' &&
        steps.pytest.outcome == 'success'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
      with:
        script: |
          const marker = '<!-- ci-latest-failure -->';
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

          const openIssues = await github.paginate(github.rest.issues.listForRepo, {
            owner,
            repo,
            state: 'open',
            labels: 'github_actions',
            per_page: 100,
          });
          for (const issue of openIssues) {
            if (issue.pull_request || !(issue.body || '').includes(marker)) {
              continue;
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: `\`ci-latest\` is green again (${runUrl}). Closing this tracking issue.`,
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: 'completed',
            });
            core.info(`Closed ci-latest issue #${issue.number}`);
          }
