name: phi-scan (secondary privacy review)

# PR trigger removed intentionally: this advisory scan was running before the
# privacy-gates job in ci.yml had a chance to pass. The weekly schedule and
# workflow_dispatch remain for periodic full-repo coverage.
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '29 6 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phi-scan:
    name: Advisory PHI/PII text scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.11.25"
      - name: Make a tracked-files-only scan input
        run: |
          mkdir -p "$RUNNER_TEMP/phi-scan-input"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/phi-scan-input"
      - name: Run phi-scan (quiet; no report upload)
        working-directory: ${{ runner.temp }}/phi-scan-input
        run: >-
          uvx --from 'phi-scan==0.7.0' phi-scan scan .
          --config "$GITHUB_WORKSPACE/.phi-scanner.yml" --baseline --no-cache --quiet --workers 4
