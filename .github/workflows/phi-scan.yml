name: phi-scan (secondary privacy review)

on:
  pull_request:
    paths:
      - '**.csv'
      - '**.tsv'
      - '.phi-scanner.yml'
      - '.github/workflows/phi-scan.yml'
  push:
    branches: [ main ]
  schedule:
    - cron: '29 6 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phi-scan:
    name: Advisory PHI/PII text scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.11.25"
      - name: Make a tracked-files-only scan input
        run: |
          mkdir -p "$RUNNER_TEMP/phi-scan-input"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/phi-scan-input"
      - name: Run phi-scan (quiet; no report upload)
        working-directory: ${{ runner.temp }}/phi-scan-input
        run: >-
          uvx --from 'phi-scan==0.7.0' phi-scan scan .
          --config "$GITHUB_WORKSPACE/.phi-scanner.yml" --baseline --no-cache --quiet --workers 4
