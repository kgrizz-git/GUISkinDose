name: phi-scan (advisory)

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '29 6 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phi-scan:
    name: Advisory PHI/PII text scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.11.25"
      - name: Make a tracked-files-only scan input
        run: |
          mkdir -p "$RUNNER_TEMP/phi-scan-input"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/phi-scan-input"
      - name: Run phi-scan (advisory; no report upload)
        continue-on-error: true
        working-directory: ${{ runner.temp }}/phi-scan-input
        run: >-
          uvx --from 'phi-scan==0.7.0' phi-scan scan .
          --config "$GITHUB_WORKSPACE/.phi-scanner.yml" --no-cache --quiet
