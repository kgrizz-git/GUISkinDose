name: phi-scan (secondary privacy review)

# Full-repo CSV/TSV PR scans were removed so privacy-gates in ci.yml can run first.
# Pull requests that only touch phi-scan wiring or the reviewed baseline still run
# here so baseline refreshes are validated before merge.
on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - .phi-scanbaseline
      - .phi-scanner.yml
      - .github/workflows/phi-scan.yml
  schedule:
    - cron: '29 6 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phi-scan:
    name: Advisory PHI/PII text scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.11.25"
      - name: Make a tracked-files-only scan input
        run: |
          mkdir -p "$RUNNER_TEMP/phi-scan-input"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/phi-scan-input"
      - name: Run phi-scan (quiet; no report upload)
        working-directory: ${{ runner.temp }}/phi-scan-input
        run: |
          set -euo pipefail
          if ! uvx --from 'phi-scan==0.7.0' phi-scan scan . \
            --config "$GITHUB_WORKSPACE/.phi-scanner.yml" \
            --baseline --no-cache --quiet --workers 4; then
            echo "::group::phi-scan findings (re-run without --quiet)"
            uvx --from 'phi-scan==0.7.0' phi-scan scan . \
              --config "$GITHUB_WORKSPACE/.phi-scanner.yml" \
              --baseline --no-cache --workers 4
            echo "::endgroup::"
            exit 1
          fi
