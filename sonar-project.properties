# NOTE: read only by the sonar-scanner CLI (local / CI-based analysis), NOT by
# SonarCloud Automatic Analysis (which reads .sonarcloud.properties). Keep the
# exclusion lists in the two files in sync.
sonar.projectKey=kgrizz-git_GUISkinDose
sonar.projectName=GUISkinDose
sonar.organization=kgrizz-git
sonar.sourceEncoding=UTF-8
sonar.sources=src,scripts
sonar.tests=tests
sonar.python.version=3.10,3.11,3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.exclusions=**/__pycache__/**,**/*.pyc,dev-docs/**,src/**/example_data/**,src/**/phantom_data/**,src/**/table_data/**,tmp/**,PlotOutputs/**,htmlcov/**,coverage.xml,**/*.dcm,**/*.dicom,**/*.ipynb,**/*.log,**/*.txt,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.svg,**/*.csv,**/*.tsv,**/*.xlsx,**/*.xls,**/*.xlsb,**/*.xlsm,**/*.doc,**/*.docx,**/*.pdf,**/*.pptx,**/*.json,**/*.db,**/*.sqlite,**/*.parquet,**/*.avif,**/*.bmp,**/*.eps,**/*.heic,**/*.ico,**/*.npy,**/*.npz,**/*.ps,**/*.stl,**/*.tif,**/*.tiff,**/*.ttf,**/*.webp,**/*.woff,**/*.woff2
sonar.test.exclusions=tests/fixtures/**
sonar.coverage.exclusions=tests/**,scripts/**
