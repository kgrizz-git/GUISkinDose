# .sonarcloud.properties — read by SonarQube Cloud *Automatic Analysis*.
# (sonar-project.properties is IGNORED by Automatic Analysis; it applies only to the
# sonar-scanner CLI used for local/CI-based analysis. Keep the two exclusion lists in sync.)
#
# NOTE on wildcards: the SonarQube Cloud docs state "Wildcard patterns are not allowed"
# in this file. That does NOT match observed behavior for this project — a controlled
# PR probe (docs/sonar_probe/probe_excluded.py matched by `**/probe_excluded.py`) was
# confirmed dropped from a full Automatic Analysis while an unexcluded control file in
# the same directory was analyzed. So the glob patterns below are empirically honored
# here. If SonarCloud ever tightens this, move these patterns to the UI
# (Administration > General Settings > Analysis Scope > Files), which supports wildcards.
#
# Intent: keep data/asset directories — where private data is most likely to land — and
# non-source artifacts out of third-party cloud analysis, and cut scan noise. This is
# scan hygiene + defense-in-depth, NOT a privacy control: on this PUBLIC repo the real
# PHI/PII guard is the commit/CI gates (check_sensitive_content.py forbids *.log,
# hash-gates images/DICOM/notebook outputs, and pattern-scans all UTF-8 text).

sonar.exclusions=**/__pycache__/**,**/*.pyc,dev-docs/**,src/**/example_data/**,src/**/phantom_data/**,src/**/table_data/**,**/*.dcm,**/*.ipynb,**/*.log,**/*.txt,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.svg
sonar.test.exclusions=tests/fixtures/**
sonar.coverage.exclusions=tests/**,scripts/**
