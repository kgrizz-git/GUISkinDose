# .sonarcloud.properties — read by SonarQube Cloud *Automatic Analysis*.
# (sonar-project.properties is IGNORED by Automatic Analysis; it only applies to
# the sonar-scanner CLI used for local/CI-based analysis. Keep the exclusion lists
# in these two files in sync.)
#
# Intent: keep data/asset directories — the places private data is most likely to
# land — and non-source artifacts out of third-party cloud analysis, and cut scan
# noise. IMPORTANT: this is scan hygiene + defense-in-depth, NOT a privacy control.
# The real guard against PHI/PII entering this PUBLIC repo is the commit-time and CI
# gates: check_sensitive_content.py forbids *.log outright, requires approved hashes
# for images/DICOM/notebook outputs/binaries, and pattern-scans all UTF-8 text
# (incl. *.txt and *.ipynb). Once committed here, content is public regardless of
# Sonar's scope.
#
# Functional-vs-intent note: Sonar only analyzes source languages, so the data-dir,
# dev-docs, and *.ipynb entries actually change what gets analyzed; the image/*.txt/
# *.log entries are belt-and-suspenders (Sonar has no analyzer for them) kept here to
# document intent and to carry over if this ever moves to CI-based analysis.

# Source-file exclusions (Automatic Analysis auto-detects sources; scope is refined
# via exclusions rather than sonar.sources).
sonar.exclusions=**/__pycache__/**,**/*.pyc,dev-docs/**,src/**/example_data/**,src/**/phantom_data/**,src/**/table_data/**,**/*.dcm,**/*.ipynb,**/*.log,**/*.txt,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.svg

# Test-file exclusions (fixtures may carry sample inputs).
sonar.test.exclusions=tests/fixtures/**

# Coverage isn't uploaded under Automatic Analysis, but keep the intent explicit
# so it carries over if this ever moves to CI-based analysis.
sonar.coverage.exclusions=tests/**,scripts/**
