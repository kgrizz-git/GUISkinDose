# .sonarcloud.properties — read by SonarQube Cloud *Automatic Analysis*.
#
# IMPORTANT: Automatic Analysis does NOT support wildcard/glob patterns in this
# file ("Wildcard patterns are not allowed" — SonarQube Cloud docs). Only explicit,
# literal file paths work here. Pattern-based scope (e.g. src/**/example_data/**,
# **/*.ipynb) MUST be configured in the SonarCloud UI:
#   Administration > General Settings > Analysis Scope > Files
# (source/test file inclusions & exclusions). See the patterns mirrored in
# sonar-project.properties, which the sonar-scanner CLI (local/CI-based analysis)
# DOES honor with wildcards.
#
# Scope exclusion is scan hygiene + defense-in-depth, not a privacy control: on this
# PUBLIC repo the real PHI/PII guard is the commit/CI gates (check_sensitive_content.py
# forbids *.log, hash-gates images/DICOM/notebook outputs, pattern-scans UTF-8 text).
#
# No directives are set here on purpose — wildcard exclusions placed here would be
# silently ignored. Configure the exclusions in the UI (or switch to CI-based
# analysis, which reads sonar-project.properties with full wildcard support).
