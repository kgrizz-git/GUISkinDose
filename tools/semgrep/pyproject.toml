# Isolated, hash-locked environment for the Semgrep scanner.
#
# Semgrep is deliberately not a project dependency: it is only ever run as a CLI,
# never imported, and its own tight pins held four transitive advisories below their fixes
# while it sat in the root `dev` extra. See scripts/semgrep_tool.py.
#
# Semgrep 1.179.0 requires `pyjwt[crypto]>=2.15.0,<3`, so the lock carries a patched pyjwt.
# Older semgrep pinned `~=2.13.0`, which is why earlier pyjwt alerts against this lock were
# dismissed as unreachable: jwt is only executed under `semgrep mcp`, which these gates never
# invoke. Those alerts should now close as fixed.
#
# This mini-project exists so that isolation does not cost integrity. `uvx --from
# semgrep==<pin>` resolves a version but re-resolves and re-verifies its entire
# dependency tree on every run; the uv.lock beside this file pins each of those
# transitive packages to an exact version and sha256, which is what `uv sync --locked`
# gave us before Semgrep left the root lock.
#
# Deliberately NOT a uv workspace member of the root project: joining the workspace
# would merge these dependencies back into the root resolution and undo the isolation.
# Dependabot refreshes this project's transitive lock versions with lockfile-only uv
# updates, ignoring Semgrep itself. The version of record remains
# dev-docs/privacy_tool_inventory.json; the weekly `ci-latest` probe surfaces scanner
# movement so inventory and manifest pins can be upgraded together after review.
[project]
name = "guiskindose-semgrep-tool"
version = "0"
description = "Pinned, hash-locked Semgrep scanner environment (not shipped, not importable)."
requires-python = ">=3.11"  # wcmatch 11+ needs 3.11; the project floor is 3.11 too
dependencies = ["semgrep==1.179.0"]

# Nothing here is built or installed as a package; this project only carries the lock.
[tool.uv]
package = false

# Semgrep (up to at least 1.187.0) pins wcmatch~=8.3, which holds it below the ReDoS fix for
# GHSA-53pm-wgxf-c6qf (fixed in 11.2). Force the fixed version. Verified 2026-11-24: with
# wcmatch 12.0.4 both gates give identical results to 8.5.2 (OWASP: 181 rules on 330 files,
# 0 findings; project privacy rules: OK). Drop this once Semgrep relaxes its pin.
override-dependencies = ["wcmatch>=11.2"]

# Scanner-only advisories that Semgrep's own exact pins hold below their fixes (Semgrep 1.179.0
# requires mcp==1.29.0 and the opentelemetry ~=1.37 family). They are reachable only through
# `semgrep mcp` and Semgrep's telemetry, which neither gate runs (--metrics=off, no mcp
# subcommand). Each ID is listed individually so that any NEW advisory on this lock fails the
# audit, whatever its severity. Re-check on every Semgrep bump and drop an ID once its package is
# fixed (see the "Re-check ignored dependency advisories" item in dev-docs/TO_DO.md).
[tool.uv.audit]
ignore = [
    # mcp 1.29.0 (fixed in 2.2.0; GHSA-84m7-p3x7-pcfv fixed in 1.30.0)
    "GHSA-qx49-fqc8-xw99",
    "GHSA-5h93-6whr-6q8j",
    "GHSA-w4fh-qvv9-3v23",
    "GHSA-84m7-p3x7-pcfv",
    "GHSA-rwrf-2pqf-9j8j",
    # opentelemetry-api 1.37.0 (fixed in 1.45.1 / 1.45.2)
    "GHSA-mf5v-w3w3-f6cg",
    "GHSA-xcq7-p3pf-p88h",
]
