# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit: auto-review off; path filters exclude sensitive surfaces from cloud review.
# Reviews are requested from ci.yml `request-coderabbit` only after privacy-gates succeeds
# (draft PRs are skipped). Manual `@coderabbitai review` requests bypass that CI ordering,
# so these filters are defense in depth rather than an admission-control boundary.
language: en-US
reviews:
  auto_review:
    enabled: false
    drafts: false
  path_filters:
    - "!src/**/example_data/**"
    - "!src/**/phantom_data/**"
    - "!src/**/table_data/**"
    - "!tests/fixtures/**"
    - "!dev-docs/**"
    - "!tmp/**"
    - "!PlotOutputs/**"
    - "!htmlcov/**"
    - "!coverage.xml"
    - "!**/*.dcm"
    - "!**/*.dicom"
    - "!**/*.ipynb"
    - "!**/*.log"
    - "!**/*.txt"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.gif"
    - "!**/*.svg"
    - "!**/*.csv"
    - "!**/*.tsv"
    - "!**/*.xlsx"
    - "!**/*.xls"
    - "!**/*.xlsb"
    - "!**/*.xlsm"
    - "!**/*.doc"
    - "!**/*.docx"
    - "!**/*.pdf"
    - "!**/*.pptx"
    - "!**/*.json"
    - "!**/*.db"
    - "!**/*.sqlite"
    - "!**/*.parquet"
    - "!**/*.avif"
    - "!**/*.bmp"
    - "!**/*.eps"
    - "!**/*.heic"
    - "!**/*.ico"
    - "!**/*.npy"
    - "!**/*.npz"
    - "!**/*.ps"
    - "!**/*.stl"
    - "!**/*.tif"
    - "!**/*.tiff"
    - "!**/*.ttf"
    - "!**/*.webp"
    - "!**/*.woff"
    - "!**/*.woff2"
    - "!**/uv.lock"
    - "!**/__pycache__/**"
    - "!**/*.pyc"
