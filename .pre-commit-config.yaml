# Local git hooks (fast subset of CI). Install once per clone:
#   pip install -e ".[dev,gui]"
#   pre-commit install
#   pre-commit install --hook-type pre-push
#
# Run manually:
#   pre-commit run --all-files
#   pre-commit run --hook-stage pre-push basedpyright --all-files
# CI still runs the full matrix (pytest, basedpyright, bandit, pip-audit, gui-smoke, etc.).

minimum_pre_commit_version: "3.0.0"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        name: ruff (src + tests)
        files: ^(src|tests)/
        args: [--fix]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        name: bandit (src + scripts, medium+ severity)
        # Pre-commit passes staged file paths; do not use -r here (CI scans directories).
        args: ["-c", "pyproject.toml", "--severity-level", "medium"]
        files: ^(src/mypyskindose|scripts)/

  - repo: local
    hooks:
      - id: doc-freshness
        name: documentation freshness (broken links)
        entry: python scripts/check_doc_freshness.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-file-sizes
        name: check file sizes (<800 lines)
        entry: python scripts/check_file_sizes.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-untracked-scratch
        name: check for untracked scratch files
        entry: python scripts/check_untracked_scratch.py
        language: system
        pass_filenames: false
        always_run: true

      - id: cleanup-old-backups
        name: cleanup stale backups/ files (>5 commits)
        entry: python scripts/cleanup_old_backups.py
        language: system
        pass_filenames: false
        always_run: true

      - id: license-notices
        name: third-party notices (stale check)
        entry: python scripts/check_licenses.py --check-notices
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|dev-docs/THIRD_PARTY_NOTICES\.md)$
        stages: [pre-commit]

      - id: basedpyright
        name: basedpyright (type check)
        entry: basedpyright
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: check-changelog
        name: changelog updated (src/tests changes require CHANGELOG.md entry)
        entry: python scripts/check_changelog.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
