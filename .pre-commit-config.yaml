# Local git hooks (fast subset of CI). Install once per clone:
#   pip install -e ".[dev,gui]"
#   bash scripts/setup-dev.sh          # macOS/Linux
#   scripts\setup-dev.bat              # Windows
#
# Run manually:
#   pre-commit run --all-files
#   pre-commit run --hook-stage pre-push --all-files
#
# CI runs the full matrix (pytest, basedpyright, bandit, pip-audit, gui-smoke, etc.).

minimum_pre_commit_version: "3.0.0"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        name: ruff (src + tests)
        files: ^(src|tests)/
        args: [--fix]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: shellcheck (shell script lint)

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        name: bandit (src + scripts, medium+ severity)
        # Pre-commit passes staged file paths; do not use -r here (CI scans directories).
        args: ["-c", "pyproject.toml", "--severity-level", "medium"]
        files: ^(src/mypyskindose|scripts)/

  - repo: local
    hooks:
      - id: doc-freshness
        name: documentation freshness (broken links)
        entry: python scripts/check_doc_freshness.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: sonar-properties-parity
        name: Sonar configuration scope parity
        entry: python scripts/check_sonar_properties.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: sensitive-content
        name: sensitive content and approved assets
        entry: python scripts/check_sensitive_content.py --require-approved-assets
        language: system
        pass_filenames: false
        always_run: true

      - id: privacy-admission-policy
        name: protected privacy paths and scanner routing policy
        entry: python scripts/privacy_admission.py check --mode staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: privacy-admission-receipts
        name: conditional privacy scanner receipts (staged snapshot)
        entry: python scripts/privacy_admission.py verify --mode staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: privacy-admission-policy-push
        name: protected privacy paths and scanner routing policy (push)
        entry: python scripts/privacy_admission.py check --mode range
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: privacy-admission-receipts-push
        name: conditional privacy scanner receipts (branch range)
        entry: python scripts/privacy_admission.py verify --mode range
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: sensitive-commit-message
        name: sensitive content in commit message
        entry: python scripts/check_commit_message.py
        language: system
        stages: [commit-msg]

      - id: asset-inventory-markdown
        name: approved asset inventory Markdown
        entry: python scripts/render_asset_inventory.py --check
        language: system
        pass_filenames: false
        always_run: true

      - id: privacy-tool-inventory
        name: privacy tool inventory and scanner references
        entry: python scripts/render_privacy_tool_inventory.py --check
        language: system
        pass_filenames: false
        always_run: true

      - id: sync-gui-help
        name: GUI help sync (docs/source/gui_help -> src/guiskindose/gui/help)
        entry: python scripts/sync_gui_help.py --check
        language: system
        pass_filenames: false
        always_run: true

      - id: help-registry
        name: GUI help registry
        entry: python scripts/check_help_registry.py
        language: system
        pass_filenames: false
        always_run: true

      - id: ui-copy
        name: UI copy catalog
        entry: python scripts/check_ui_copy.py
        language: system
        pass_filenames: false
        always_run: true

      - id: feature-doc-matrix
        name: feature doc matrix
        entry: python scripts/check_feature_doc_matrix.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-file-sizes
        name: check file sizes (<800 lines)
        entry: python scripts/check_file_sizes.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-stale-brand
        name: check for stale brand strings
        entry: python scripts/check_stale_brand.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-gui-test-placement
        name: GUI test placement (no nicegui imports outside tests/gui)
        entry: python scripts/check_gui_test_placement.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: check-untracked-scratch
        name: check for untracked scratch files
        entry: python scripts/check_untracked_scratch.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-ignored-assets
        name: ignored risky artifacts outside approved roots
        entry: python scripts/check_ignored_asset_files.py --strict
        language: system
        pass_filenames: false
        always_run: true

      - id: check-doc-pruning
        name: doc pruning candidates (advisory)
        entry: python scripts/check_doc_pruning.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-agent-guidance
        name: agent guidance consistency (advisory)
        entry: python scripts/check_agent_guidance.py
        language: system
        pass_filenames: false
        always_run: true

      - id: hounddog-dataflow
        name: HoundDog PHI/PII dataflow scan (local-only, advisory)
        entry: python scripts/run_hounddog_advisory.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: cleanup-old-backups
        name: cleanup stale backups/ files (>5 commits)
        entry: python scripts/cleanup_old_backups.py
        language: system
        pass_filenames: false
        always_run: true

      - id: license-notices
        name: third-party notices (stale check)
        entry: uv run --extra dev --extra gui --locked python scripts/check_licenses.py --check-notices
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|dev-docs/THIRD_PARTY_NOTICES\.md)$
        stages: [pre-commit]

      - id: pip-audit
        name: pip-audit (dependency vulnerabilities)
        entry: python scripts/audit_dependencies.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: basedpyright
        name: basedpyright (type check)
        entry: basedpyright
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: semgrep
        name: semgrep (OWASP Top 10 SAST)
        entry: semgrep --config=p/owasp-top-ten --error --metrics=off src scripts .github/workflows docs/source/conf.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: semgrep-privacy
        name: semgrep (project PHI/PII leak rules, blocking)
        entry: python scripts/run_semgrep_privacy.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: check-changelog
        name: changelog updated (src/tests changes require CHANGELOG.md entry)
        entry: python scripts/check_changelog.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
