[project]
name = "guiskindose"
version = "1.0.0"
description = "Tools and script for calculating peak skin dose and create dose maps for fluoroscopic exams from RDSR data (fork of PySkinDose)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name="Max Hellström", email="max.hellstrom@gmail.com" },
    { name="Josef Lundman", email="josef@lundman.eu" },
]
maintainers = [
    { name="Kevin Grizzard" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas >= 2.2.3",
    "numpy >= 2.2.4",
    "pydicom >= 2.0",
    "numpy-stl >= 3.2.0",
    "plotly >= 4.13.3",
    "scipy >= 1.15.2",
    "tqdm",
    "psutil",
    "pillow >= 10.0.1",
    "kaleido",
    "rich",
    "openpyxl",
    "pypdf>=6.16.1",
    "reportlab>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
gui = ["nicegui>=2.0.0", "itsdangerous>=2.1.2,<3", "pytest-asyncio>=0.24"]
gui-native = ["nicegui>=2.0.0", "itsdangerous>=2.1.2,<3", "pywebview", "pytest-asyncio>=0.24"]
# Rich report export backends (PDF via reportlab, DOCX via python-docx) are now
# core dependencies so exports work out of the box. This extra is retained as a
# no-op alias so existing `pip install guiskindose[export]` commands still work.
export = ["reportlab>=4.0", "python-docx>=1.1"]
# Sphinx site (docs/source/conf.py); nbsphinx executes the getting-started
# notebook, so it needs a kernel + ipywidgets at build time. Used by
# .readthedocs.yml (extra_requirements: [docs]).
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "pydata-sphinx-theme",
    "myst-parser",
    "nbsphinx",
    "ipykernel",
    "ipywidgets",
    "pandoc",
    "tornado>=6.5.8",  # transitive via ipykernel; GHSA-8423-8fgw-73vq / GHSA-wwv5-g3v4-889x / GHSA-mpf4-983q-p7j4
]
# Interactive notebook editing (JupyterLab); the docs build does not need this.
notebooks = [
    "jupyterlab>=4.6.2",
    "ipykernel",
    "ipywidgets",
    "tornado>=6.5.8",  # transitive via jupyter-client/ipykernel; same advisories as docs extra
]
# Optional, local-only Presidio text scan. This is intentionally separate from
# the core/runtime and normal dev installs; it is advisory and does not upload
# input or findings anywhere.
privacy-scan = [
    # Declared explicitly so a later `uv sync` cannot remove Presidio's local NLP model.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "presidio-analyzer>=2.2.360,<3",
    "spacy>=3.8,<4",
]
# Headless phantom library tooling (reduced Mesh3d previews need real quadric
# decimation — triangle subsample looks like scatter fragments in Settings).
phantom-gen = [
    "trimesh>=4",
    "fast-simplification",
    # networkx: trimesh.fill_holes boundary-loop capping.
    # scikit-image: marching-cubes watertight remesh (ingest_fun_mesh --voxel-pitch)
    # for messy raw scans that fill_holes cannot close (e.g. Ramesses II).
    "networkx>=3",
    "scikit-image>=0.22",
]
dev = [
    "basedpyright>=1.23",
    "defusedxml>=0.7.1",
    "pandas-stubs>=2.2",
    "types-Pillow",
    "pip-audit>=2.7",
    "bandit>=1.8",
    "shellcheck-py>=0.11",
    "pre-commit>=4.0",
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "diff-cover>=10.0",
    "ruff>=0.15,<0.17",
    "playwright>=1.40",
    "pytest-playwright>=0.4",
]

[project.scripts]
guiskindose = "guiskindose.__main__:cli"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["guiskindose*"]
exclude = ["guiskindose.egg-info*"]


[project.urls]
# Kept in sync with the GitHub repository slug (renamed to GUISkinDose on
# 2026-09-04); GitHub redirects keep old links working.
"Homepage" = "https://github.com/kgrizz-git/GUISkinDose"
"Bug Tracker" = "https://github.com/kgrizz-git/GUISkinDose/issues"
"Documentation" = "https://github.com/kgrizz-git/GUISkinDose/tree/main/docs"

[build-system]
requires = ["setuptools>=68.2.2"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: long-running tests (e.g. 1000+ event dose stress); deselect with '-m \"not slow\"'",
    "blender_mpfb: requires local Blender ≥4.2 with MPFB; skipped when unavailable",
]

[tool.coverage.run]
# Runbook scripts verified by execution (PASS report), not import coverage:
# verify_distribution.py orchestrates uv build + venv + subprocess runs that
# cannot execute under pytest-xdist. Its pure helpers stay lint/type-gated.
omit = ["scripts/verify_distribution.py"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ruff 0.16 expands its implicit default from 59 to 413 rules. Keep the
# established baseline explicit and opt into reviewed modernization rules only.
select = ["E4", "E7", "E9", "F", "B", "C4", "FURB", "I", "PYI", "RUF", "SIM", "UP"]
# Keep the global policy strict; intentional typographic notation and NiceGUI context
# scopes are exempted only where they occur below.

[tool.ruff.lint.per-file-ignores]
"tests/gui/nicegui_main.py" = ["E402"]
"tests/unittests/test_export_data.py" = ["E402"]
"tests/unittests/test_path_safety.py" = ["E402"]
"scripts/phantom_gen/transform_to_psd_frame.py" = ["RUF002"]
"scripts/phantom_gen/validate_phantom.py" = ["RUF002"]
"src/guiskindose/calculate_dose/add_correction_and_event_dose_to_output.py" = ["RUF003"]
"src/guiskindose/cli_kerma_meter.py" = ["RUF001"]
"src/guiskindose/corrections.py" = ["RUF002", "RUF003"]
"src/guiskindose/export/metrics.py" = ["RUF002", "RUF003"]
"src/guiskindose/export/models.py" = ["RUF002", "RUF003"]
"src/guiskindose/export/payload.py" = ["RUF002"]
"src/guiskindose/geom_calc.py" = ["RUF001", "RUF003"]
"src/guiskindose/grid_interp.py" = ["RUF002"]
"src/guiskindose/gui/exam_transforms.py" = ["RUF002"]
"src/guiskindose/gui/helpers.py" = ["RUF002"]
"src/guiskindose/gui/state.py" = ["RUF003"]
"src/guiskindose/gui/tabs/_per_exam.py" = ["RUF001", "SIM117"]
"src/guiskindose/gui/tabs/results_builders.py" = ["SIM117"]
"src/guiskindose/gui/tabs/settings.py" = ["SIM117"]
"src/guiskindose/gui/tabs/upload_builders.py" = ["SIM117"]
"src/guiskindose/gui/widgets/import_preview.py" = ["RUF001"]
"src/guiskindose/gui/window_prefs.py" = ["RUF002"]
"src/guiskindose/input_adapters/tabular_loader.py" = ["RUF002"]
"src/guiskindose/settings/kerma_meter_correction_settings.py" = ["RUF002"]
"tests/gui/test_multi_exam_gui.py" = ["RUF002", "RUF003"]
"tests/unittests/test_export_payload.py" = ["RUF002"]
"tests/unittests/test_gui_offset_reset.py" = ["RUF002"]
"tests/unittests/test_phantom_gen_pipeline.py" = ["RUF002", "RUF003"]
"tests/unittests/test_phantom_vertices.py" = ["RUF003"]
"tests/unittests/test_refactor_coverage.py" = ["RUF003"]

[tool.basedpyright]
pythonVersion = "3.11"
# Pin the environment instead of letting basedpyright guess one. The pre-push hook
# runs bare `basedpyright` with `language: system`, so it resolves from PATH; left
# to guess it picked a Homebrew interpreter and type-checked *that* stdlib, where
# 3.14 t-strings fail against the 3.11 target above. CI never saw this because it
# runs inside `uv run`, which already points at .venv.
venvPath = "."
venv = ".venv"
include = ["src/guiskindose", "tests/unittests", "tests/gui", "tests/integrationtests", "scripts"]
exclude = [
    "**/__pycache__",
    "src/guiskindose/table_data",
    "tests/manual_tests",
    # Headless Blender/MPFB tooling: bpy/trimesh/numpy-stl stubs are incomplete.
    "scripts/phantom_gen",
]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
# CI runs plain `basedpyright` (zero errors required). To accept temporary debt during
# incremental typing, uncomment baselineFile, run `./scripts/type_baseline.sh write`,
# commit `.basedpyright/baseline.json`, and use the baseline CI command documented in
# dev-docs/HARNESS_ENGINEERING.md.
# baselineFile = ".basedpyright/baseline.json"

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
    "build",
    "dist",
    "backups",
    "src/guiskindose/table_data",
]
# Application code only; tests excluded above. CI fails on medium+ severity (see HARNESS_ENGINEERING.md).
skips = ["B101"]

[tool.uv.audit]
# Tracked dependency-audit suppressions (read natively by `uv audit`; the
# scripts/audit_dependencies.py wrapper mirrors these IDs to `pip-audit --ignore-vuln`
# on its fallback path). Every entry MUST have a documented reason and be revisited
# (see the "Re-check ignored dependency advisories" item in dev-docs/TO_DO.md).
#
# `ignore-until-fixed` suppresses a finding ONLY while no patched release exists, so the
# audit automatically fails again once an upstream fix is published.
# Currently EMPTY. Read the next paragraph before concluding anything from that.
#
# All five entries this project carried (click PYSEC-2026-2132; mcp GHSA-jpw9-pfvf-9f58 /
# GHSA-hvrp-rf83-w775 / GHSA-vj7q-gjh5-988w; pyjwt GHSA-w6j9-cwv2-h6wq) existed because
# semgrep pinned those transitive dependencies below their fixed versions. Semgrep now runs
# as a pinned, hash-locked isolated tool (scripts/semgrep_tool.py, tools/semgrep/), so its
# constraints no longer reach this lock.
#
# Moving semgrep out was NOT remediation for everything, and must not be described as one.
# Hash-locking it in tools/semgrep/uv.lock later put its dependencies back in view of
# Dependabot, which indexes every lockfile regardless of this repo's update config, and the
# pin bump to 1.178.0 then fixed the mcp advisories for real (mcp 1.23.3 -> 1.29.0, click
# 8.1.8 -> 8.4.2). What remains unfixed is pyjwt: semgrep still declares
# `pyjwt[crypto]~=2.13.0` at 1.178.0, so its isolated environment installs 2.13.0 and that
# vulnerable code is still present, simply outside the surface `uv audit`, `pip-audit` and
# grype inspect. Those thirteen alerts are dismissed as unreachable — see
# tools/semgrep/pyproject.toml for why — not fixed. The *project* environment also improved:
# `click` moved 8.1.8 -> 8.5.0 there, which matters because click reaches users through
# uvicorn in the `gui` extra. So of the five original entries, four are genuinely fixed
# (click here and in the tool, the three mcp advisories in the tool) and only pyjwt remains
# an audit-scope question — and it is answered by dismissal-as-unreachable, not silence.
#
# The tool environment is no longer unhashed or unwatched: tools/semgrep/uv.lock pins every
# transitive package by sha256, and Dependabot raises alerts against it. Do not add a
# suppression here for something the tool drags in — fix it in tools/semgrep, or triage it
# on the alert where the reasoning stays attached to the advisory.
#
ignore = []
# No `ignore-until-fixed` entries active. The former nltk GHSA-8mgp-746c-j5xp entry disappeared
# with the safety dev dependency (nltk was safety-only; see CHANGELOG [1.0.0] `### Removed`).
# NOTE (Dependabot): GitHub's advisory feed is independent of these ignores, and the uv.lock
# dep_scope reads as runtime to Dependabot, so its alerts may stay open for suppressed transitive
# dev-only advisories. CI's `uv audit` is the gate that matters.
