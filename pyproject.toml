[project]
name = "guiskindose"
version = "1.0.0"
description = "Tools and script for calculating peak skin dose and create dose maps for fluoroscopic exams from RDSR data (fork of PySkinDose)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name="Max Hellström", email="max.hellstrom@gmail.com" },
    { name="Josef Lundman", email="josef@lundman.eu" },
]
maintainers = [
    { name="Kevin Grizzard" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas >= 2.2.3",
    "numpy >= 2.2.4",
    "pydicom >= 2.0",
    "numpy-stl >= 3.2.0",
    "plotly >= 4.13.3",
    "scipy >= 1.15.2",
    "tqdm",
    "psutil",
    "pillow >= 10.0.1",
    "kaleido",
    "rich",
    "openpyxl",
    "pypdf>=6.16.1",
    "reportlab>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
gui = ["nicegui>=2.0.0", "pytest-asyncio>=0.24"]
gui-native = ["nicegui>=2.0.0", "pywebview", "pytest-asyncio>=0.24"]
# Rich report export backends (PDF via reportlab, DOCX via python-docx) are now
# core dependencies so exports work out of the box. This extra is retained as a
# no-op alias so existing `pip install guiskindose[export]` commands still work.
export = ["reportlab>=4.0", "python-docx>=1.1"]
# Sphinx site (docs/source/conf.py); nbsphinx executes the getting-started
# notebook, so it needs a kernel + ipywidgets at build time. Used by
# .readthedocs.yml (extra_requirements: [docs]).
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
    "nbsphinx",
    "ipykernel",
    "ipywidgets",
    "pandoc",
    "tornado>=6.5.8",  # transitive via ipykernel; GHSA-8423-8fgw-73vq / GHSA-wwv5-g3v4-889x / GHSA-mpf4-983q-p7j4
]
# Interactive notebook editing (JupyterLab); the docs build does not need this.
notebooks = [
    "jupyterlab>=4.6.2",
    "ipykernel",
    "ipywidgets",
    "tornado>=6.5.8",  # transitive via jupyter-client/ipykernel; same advisories as docs extra
]
# Optional, local-only Presidio text scan. This is intentionally separate from
# the core/runtime and normal dev installs; it is advisory and does not upload
# input or findings anywhere.
privacy-scan = [
    # Declared explicitly so a later `uv sync` cannot remove Presidio's local NLP model.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "presidio-analyzer>=2.2.360,<3",
    "spacy>=3.8,<4",
]
# Headless phantom library tooling (reduced Mesh3d previews need real quadric
# decimation — triangle subsample looks like scatter fragments in Settings).
phantom-gen = [
    "trimesh>=4",
    "fast-simplification",
    # networkx: trimesh.fill_holes boundary-loop capping.
    # scikit-image: marching-cubes watertight remesh (ingest_fun_mesh --voxel-pitch)
    # for messy raw scans that fill_holes cannot close (e.g. Ramesses II).
    "networkx>=3",
    "scikit-image>=0.22",
]
dev = [
    "basedpyright>=1.23",
    "pandas-stubs>=2.2",
    "types-Pillow",
    "pip-audit>=2.7",
    "bandit>=1.8",
    "semgrep>=1.100",
    "safety>=3.0",
    "shellcheck-py>=0.11",
    "pre-commit>=4.0",
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "diff-cover>=10.0",
    "nltk>=3.10.3",  # transitive via safety; explicit pin for PYSEC-2026-3726 / GHSA-vp2x-qp44-57v7
    "ruff>=0.15,<0.17",
    "playwright>=1.40",
    "pytest-playwright>=0.4",
]

[project.scripts]
guiskindose = "guiskindose.__main__:cli"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["guiskindose*"]
exclude = ["guiskindose.egg-info*"]


[project-urls]
"Homepage" = "https://github.com/kgrizz-git/MyPySkinDose"
"Bug Tracker" = "https://github.com/kgrizz-git/MyPySkinDose/issues"
"Documentation" = "https://github.com/kgrizz-git/MyPySkinDose/tree/main/docs"

[build-system]
requires = ["setuptools>=68.2.2"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: long-running tests (e.g. 1000+ event dose stress); deselect with '-m \"not slow\"'",
    "blender_mpfb: requires local Blender ≥4.2 with MPFB; skipped when unavailable",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ruff 0.16 expands its implicit default from 59 to 413 rules. Keep the
# established baseline explicit and opt into reviewed modernization rules only.
select = ["E4", "E7", "E9", "F", "B", "C4", "FURB", "I", "PYI", "RUF", "SIM", "UP"]
# Keep the global policy strict; intentional typographic notation and NiceGUI context
# scopes are exempted only where they occur below.

[tool.ruff.lint.per-file-ignores]
"tests/gui/nicegui_main.py" = ["E402"]
"tests/unittests/test_export_data.py" = ["E402"]
"tests/unittests/test_path_safety.py" = ["E402"]
"scripts/phantom_gen/transform_to_psd_frame.py" = ["RUF002"]
"scripts/phantom_gen/validate_phantom.py" = ["RUF002"]
"src/guiskindose/calculate_dose/add_correction_and_event_dose_to_output.py" = ["RUF003"]
"src/guiskindose/cli_kerma_meter.py" = ["RUF001"]
"src/guiskindose/corrections.py" = ["RUF002", "RUF003"]
"src/guiskindose/export/metrics.py" = ["RUF002", "RUF003"]
"src/guiskindose/export/models.py" = ["RUF002", "RUF003"]
"src/guiskindose/export/payload.py" = ["RUF002"]
"src/guiskindose/geom_calc.py" = ["RUF001", "RUF003"]
"src/guiskindose/grid_interp.py" = ["RUF002"]
"src/guiskindose/gui/exam_transforms.py" = ["RUF002"]
"src/guiskindose/gui/helpers.py" = ["RUF002"]
"src/guiskindose/gui/state.py" = ["RUF003"]
"src/guiskindose/gui/tabs/_per_exam.py" = ["RUF001", "SIM117"]
"src/guiskindose/gui/tabs/results_builders.py" = ["SIM117"]
"src/guiskindose/gui/tabs/settings.py" = ["SIM117"]
"src/guiskindose/gui/tabs/upload_builders.py" = ["SIM117"]
"src/guiskindose/gui/widgets/import_preview.py" = ["RUF001"]
"src/guiskindose/gui/window_prefs.py" = ["RUF002"]
"src/guiskindose/input_adapters/tabular_loader.py" = ["RUF002"]
"src/guiskindose/settings/kerma_meter_correction_settings.py" = ["RUF002"]
"tests/gui/test_multi_exam_gui.py" = ["RUF002", "RUF003"]
"tests/unittests/test_export_payload.py" = ["RUF002"]
"tests/unittests/test_gui_offset_reset.py" = ["RUF002"]
"tests/unittests/test_phantom_gen_pipeline.py" = ["RUF002", "RUF003"]
"tests/unittests/test_phantom_vertices.py" = ["RUF003"]
"tests/unittests/test_refactor_coverage.py" = ["RUF003"]

[tool.basedpyright]
pythonVersion = "3.11"
include = ["src/guiskindose", "tests/unittests", "tests/gui", "tests/integrationtests", "scripts"]
exclude = [
    "**/__pycache__",
    "src/guiskindose/table_data",
    "tests/manual_tests",
    # Headless Blender/MPFB tooling: bpy/trimesh/numpy-stl stubs are incomplete.
    "scripts/phantom_gen",
]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
# CI runs plain `basedpyright` (zero errors required). To accept temporary debt during
# incremental typing, uncomment baselineFile, run `./scripts/type_baseline.sh write`,
# commit `.basedpyright/baseline.json`, and use the baseline CI command documented in
# dev-docs/HARNESS_ENGINEERING.md.
# baselineFile = ".basedpyright/baseline.json"

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
    "build",
    "dist",
    "backups",
    "src/guiskindose/table_data",
]
# Application code only; tests excluded above. CI fails on medium+ severity (see HARNESS_ENGINEERING.md).
skips = ["B101"]

[tool.uv.audit]
# Tracked dependency-audit suppressions (read natively by `uv audit`; the
# scripts/audit_dependencies.py wrapper mirrors these IDs to `pip-audit --ignore-vuln`
# on its fallback path). Every entry MUST have a documented reason and be revisited
# (see the "Re-check ignored dependency advisories" item in dev-docs/TO_DO.md).
#
# `ignore-until-fixed` suppresses a finding ONLY while no patched release exists, so the
# audit automatically fails again once an upstream fix is published.
ignore = [
    # click 8.1.8 is pinned by semgrep (<8.2); advisory PYSEC-2026-2132 cannot be upgraded until semgrep loosens its click requirement.
    "PYSEC-2026-2132",
    # mcp 1.23.3 is pinned exactly by semgrep; GHSA-jpw9-pfvf-9f58 / GHSA-hvrp-rf83-w775 / GHSA-vj7q-gjh5-988w
    # are fixed in mcp >=1.27.2 / >=1.28.1. Suppress until semgrep relaxes or bumps the pin. mcp is only
    # pulled in for the optional Semgrep MCP server path and is not used by GUISkinDose runtime code.
    "GHSA-jpw9-pfvf-9f58",
    "GHSA-hvrp-rf83-w775",
    "GHSA-vj7q-gjh5-988w",
]
# Drop automatically once a patched nltk release exists (see uv audit --ignore-until-fixed).
ignore-until-fixed = [
    # Transitive via safety (dev extra). NLTK model-artifact APIs bypass pathsec (GHSA-8mgp-746c-j5xp /
    # CVE-2026-81726). No patched release as of 2026-09-02; nltk is not used by GUISkinDose runtime.
    "GHSA-8mgp-746c-j5xp",
]
