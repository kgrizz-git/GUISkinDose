# Advisory phi-scan configuration. The deterministic repository gate is the
# blocking control; this scans data-shaped tracked text for an additional view.
# Runtime source sinks are covered by the blocking project Semgrep rules, while
# Presidio provides the broader weekly NLP review of bounded text files.
version: 1

scan:
  confidence_threshold: 0.8
  # Medium findings are dominated by dates and numeric physics-table values.
  # High-severity additions remain visible and must be triaged.
  severity_threshold: high
  max_file_size_mb: 10
  follow_symlinks: false
  include_extensions:
    - .csv
    - .tsv
  exclude_paths:
    - .git/
    - .venv/
    - build/
    - dist/
    - docs/_build/
    - node_modules/
    # phi-scan 0.7.0 raises on this generated one-line JSON fixture (>4096
    # characters of code context). The blocking deterministic gate still scans it.
    - tests/fixtures/export/single_exam_siemens.json
    # These generated numeric lookup tables exceed spaCy's 1,000,000-character
    # per-document limit in phi-scan 0.7.0. The blocking gate scans all three.
    - src/guiskindose/table_data/hvl_tables/hvl_allura_filters_11deg.csv
    - src/guiskindose/table_data/hvl_tables/hvl_axiom_filters_8deg.csv
    - src/guiskindose/table_data/hvl_tables/hvl_combined.csv
    - "*.egg-info/"
    - __pycache__/
    - .mypy_cache/
    - .pytest_cache/
    - .ruff_cache/
    - htmlcov/
    - "*.ipynb"
    - "*.pyc"

ai:
  # Do not send findings to an AI provider from this public-repository workflow.
  enable_ai_review: false
